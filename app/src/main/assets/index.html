<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>MokTrak Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#wrap{width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#wrap{position:relative;overflow:hidden}
#videoWrap{position:absolute;inset:0;transform-origin:center center;will-change:transform}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud,#fps{position:absolute;z-index:5;color:#00ff88;background:rgba(0,0,0,0.4);border:1px solid #00ff8844;border-radius:14px;font:600 11px monospace;padding:6px 9px;text-shadow:0 1px 3px #000;backdrop-filter:blur(6px)}
#hud{top:10px;right:10px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fps{top:10px;left:10px}
#hint{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:rgba(0,0,0,0.6);border:1px solid #00ff88;color:#00ff88;padding:12px 20px;border-radius:20px;text-align:center;font-size:13px;max-width:85%;line-height:1.6;backdrop-filter:blur(8px)}
#panel{position:absolute;z-index:5;right:8px;top:44%;transform:translateY(-50%);display:none;pointer-events:none;min-width:148px;max-width:172px;background:rgba(0,0,0,0.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,255,136,0.35);border-radius:11px;padding:8px;color:#fff;font:11px ui-monospace,monospace;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,0.9)}
#panel .title{font-weight:800;color:#00ff88;border-bottom:1px solid rgba(0,255,136,0.3);padding-bottom:4px;margin-bottom:4px;font-size:12px}
.row{display:flex;justify-content:space-between;gap:8px}
.k{color:rgba(0,255,136,0.7)}.v{color:#fff;font-weight:700}
.good{color:#00ff88}.warn{color:#ffca28}.bad{color:#ff5252}
button{font-family:system-ui,sans-serif;font-weight:700;cursor:pointer;border:0}
#startBtn{position:absolute;z-index:8;bottom:28px;left:50%;transform:translateX(-50%);border-radius:28px;background:#00ff88;color:#00180d;padding:15px 26px;font-size:16px;box-shadow:0 5px 24px #00ff8844;white-space:nowrap}
#startBtn:disabled{opacity:.7}
#bottomBar{position:absolute;z-index:7;bottom:14px;right:10px;display:none;gap:8px;flex-direction:row}
.ctrlBtn{width:52px;height:52px;border-radius:26px;background:rgba(0,26,16,0.7);border:1.5px solid #00ff8866;color:#00ff88;font-size:20px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.ctrlBtn:active{transform:scale(.92)}
.ctrlBtn.rec{background:#ff1744;border-color:#ff1744;color:#fff}
.ctrlBtn.rec.on{animation:pulse 1s infinite}
.ctrlBtn.zoom{background:rgba(0,30,20,0.85);font-size:22px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff174488}50%{box-shadow:0 0 0 12px #ff174400}}
#espBar{position:absolute;z-index:7;top:80px;right:10px;display:none;gap:6px;align-items:center;background:rgba(0,0,0,0.35);border:1px solid rgba(0,255,136,0.35);border-radius:14px;padding:6px 9px;font:600 10px monospace;backdrop-filter:blur(8px)}
#espBar input{background:rgba(0,26,16,0.8);border:1px solid #00ff8855;border-radius:8px;color:#00ff88;padding:4px 7px;font:600 10px monospace;width:96px;outline:none}
#espBar input:focus{border-color:#00ff88}
#espBtn{background:#00ff88;color:#00180d;border-radius:8px;padding:5px 10px;font:700 10px system-ui}
#espBtn.off{background:#444;color:#aaa}
#espDot{width:8px;height:8px;border-radius:50%;background:#666;flex-shrink:0}
#espDot.on{background:#00ff88;box-shadow:0 0 8px #00ff88}
#espDot.off{background:#ff5252}
#espDot.mid{background:#ffca28}
#statusBar{position:absolute;z-index:6;top:42px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);color:#00ff88;font:600 10px monospace;padding:5px 12px;border-radius:10px;border:1px solid rgba(0,255,136,0.3);display:none;max-width:90%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(6px)}
#logBox{position:absolute;z-index:5;bottom:80px;left:10px;right:120px;max-height:130px;display:none;flex-direction:column-reverse;gap:2px;overflow:hidden;pointer-events:none}
.logLine{background:rgba(0,0,0,0.32);border:1px solid rgba(0,255,136,0.25);border-radius:6px;padding:3px 8px;color:#00ff88;font:600 10px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,0.9);backdrop-filter:blur(6px);animation:fadeIn .3s}
.logLine.err{border-color:#ff5252;color:#ff7777}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#err{display:none;position:absolute;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:440px;background:rgba(24,0,0,0.95);border:1px solid #ff5252;border-radius:12px;padding:16px;color:#ff7777;font-size:13px;line-height:1.6;white-space:pre-wrap}
#recIndicator{position:absolute;z-index:9;top:10px;left:50%;transform:translateX(-50%);background:#ff1744;color:#fff;font:700 11px monospace;padding:6px 12px;border-radius:14px;display:none;align-items:center;gap:6px}
#recIndicator::before{content:'';width:8px;height:8px;border-radius:4px;background:#fff;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#zoomBadge{position:absolute;z-index:6;bottom:16px;left:16px;background:rgba(0,0,0,0.4);color:#00ff88;font:700 12px monospace;padding:6px 10px;border-radius:12px;border:1px solid rgba(0,255,136,0.3);display:none;backdrop-filter:blur(6px)}
</style>
</head>
<body>
<div id="wrap">
  <div id="videoWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="hud">MokTrak Pro · جاهز</div>
  <div id="fps">-- fps</div>
  <div id="zoomBadge">1.0×</div>
  <div id="statusBar"></div>
  <div id="recIndicator">● تسجيل <span id="recTime">00:00</span></div>
  <div id="hint">👆 نقرة مزدوجة للقفل · إصبعان للتكبير</div>
  <div id="panel"></div>
  <div id="logBox"></div>

  <div id="espBar">
    <span id="espDot"></span>
    <input id="espIP" type="text" placeholder="192.168.1.50" inputmode="numeric">
    <button id="espBtn" class="off">ربط</button>
  </div>

  <div id="bottomBar">
    <button class="ctrlBtn zoom" id="zoomOutBtn" title="تصغير">−</button>
    <button class="ctrlBtn zoom" id="zoomInBtn" title="تكبير">+</button>
    <button class="ctrlBtn" id="recenterBtn" title="إعادة ضبط">⌖</button>
    <button class="ctrlBtn" id="resetBtn" title="إلغاء القفل">✕</button>
    <button class="ctrlBtn rec" id="recordBtn" title="تسجيل">●</button>
    <button class="ctrlBtn" id="switchBtn" title="تبديل">⟳</button>
  </div>

  <button id="startBtn">▶ تشغيل الكاميرا</button>
  <div id="err"></div>
</div>

<script>
(function(){
'use strict';

const CFG = {
  patchSize: 22, initRegion: 30,
  searchRadius: 22, coarseStep: 3, fineRadius: 3,
  searchRadiusLost: 50, coarseStepLost: 6,
  scales: [0.6, 0.75, 0.9, 1.0, 1.15, 1.35, 1.6, 1.9],
  minScale: 0.5, maxScale: 2.2,
  minSAD: 3200, bestSAD: 900,
  posSmoothing: 0.55, sizeSmoothing: 0.85,
  grayMaxDim: 480, frameIntervalMs: 25,
  templateUpdateEvery: 8,
  lostFramesToWarn: 20,
  doubleTapMs: 350, doubleTapRadiusPx: 90,
  tapMoveThreshold: 22, tapMaxDuration: 400,
  espInterval: 100,
  zoomMin: 1.0, zoomMax: 6.0,
  recMaxDim: 720,
  logMaxLines: 5,
  hideGraceMs: 800
};

const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d', {alpha: true});
const videoWrap = $('videoWrap'), wrap = $('wrap');
const hud = $('hud'), fpsEl = $('fps'), panel = $('panel');
const startBtn = $('startBtn'), resetBtn = $('resetBtn'), switchBtn = $('switchBtn');
const recordBtn = $('recordBtn'), hint = $('hint'), err = $('err');
const statusBar = $('statusBar'), recIndicator = $('recIndicator'), recTime = $('recTime');
const bottomBar = $('bottomBar'), logBox = $('logBox'), zoomBadge = $('zoomBadge');
const zoomInBtn = $('zoomInBtn'), zoomOutBtn = $('zoomOutBtn'), recenterBtn = $('recenterBtn');

function setStatus(msg, duration) {
  statusBar.textContent = msg;
  statusBar.style.display = 'block';
  clearTimeout(setStatus._t);
  setStatus._t = setTimeout(() => { statusBar.style.display = 'none'; }, duration || 2000);
}
function showError(m) { err.style.display = 'block'; err.textContent = m; }
function hideError() { err.style.display = 'none'; }
function addLog(text, isError) {
  if (!logBox) return;
  const line = document.createElement('div');
  line.className = 'logLine' + (isError ? ' err' : '');
  const t = new Date();
  const hh = String(t.getHours()).padStart(2, '0');
  const mm = String(t.getMinutes()).padStart(2, '0');
  const ss = String(t.getSeconds()).padStart(2, '0');
  line.textContent = `[${hh}:${mm}:${ss}] ${text}`;
  logBox.appendChild(line);
  while (logBox.children.length > CFG.logMaxLines) logBox.removeChild(logBox.firstChild);
}

let stream = null, running = false, facing = 'environment';
let lastFrame = 0, fpsN = 0, fpsT = performance.now(), fps = 0;
let rafId = 0, frameCount = 0;
let tracked = null;
let lastTap = null, pointerStart = null;
let zoom = 1.0;
let recording = false, recorder = null, recChunks = [], recStartTime = 0, recTimer = 0;
let hideTimer = null;

const grayCanvas = document.createElement('canvas');
const grayCtx = grayCanvas.getContext('2d', {willReadFrequently: true});
let grayData = null, grayW = 480, grayH = 360;
const scratchRegion = new Uint8Array(CFG.patchSize * CFG.patchSize);

const recCanvas = document.createElement('canvas');
const recCtx = recCanvas.getContext('2d');

const pointers = new Map();
let pinchStartDist = 0, pinchStartZoom = 1, isPinching = false;

function getTwoPointerDistance() {
  const pts = Array.from(pointers.values());
  if (pts.length < 2) return 0;
  return Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
}

// ═══════════════════════════════════════════════
//  ESP8266
// ═══════════════════════════════════════════════
const espSender = {
  ip: localStorage.getItem('moktrak_esp_ip') || '',
  enabled: false, lastSend: 0, ok: false, fails: 0, timer: null, sentCount: 0,
  setIP(v) {
    this.ip = (v || '').trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    if (this.ip) localStorage.setItem('moktrak_esp_ip', this.ip);
    else localStorage.removeItem('moktrak_esp_ip');
  },
  ping() {
    if (!this.ip) return;
    const self = this;
    const img = new Image();
    img.onload = img.onerror = () => {
      const wasOk = self.ok;
      self.ok = true; self.fails = 0;
      if (!wasOk) addLog('✅ ESP متصل: ' + self.ip);
      updateEspUI();
    };
    img.src = `http://${this.ip}/status?_=${Date.now()}`;
    setTimeout(() => { if (self.fails > 0) { self.ok = false; updateEspUI(); } }, 1000);
  },
  send() {
    if (!this.enabled || !this.ip) return;
    const now = performance.now();
    if (now - this.lastSend < CFG.espInterval) return;
    this.lastSend = now;
    if (!tracked) { this._fire(`http://${this.ip}/t?live=0`); return; }
    const vScaleX = (video.videoWidth || 640) / grayW;
    const vScaleY = (video.videoHeight || 480) / grayH;
    const vcx = tracked.cx * vScaleX, vcy = tracked.cy * vScaleY;
    const vw = CFG.patchSize * tracked.scale * vScaleX;
    const vh = CFG.patchSize * tracked.scale * vScaleY;
    const x = Math.round(vcx - (video.videoWidth / 2));
    const y = Math.round(vcy - (video.videoHeight / 2));
    const w = Math.round(vw), h = Math.round(vh);
    const vx = Math.round(tracked.velocity[0] * vScaleX);
    const vy = Math.round(tracked.velocity[1] * vScaleY);
    const sp = Math.round(Math.hypot(vx, vy));
    const liveFlag = tracked.live ? 1 : 0;
    this._fire(`http://${this.ip}/t?x=${x}&y=${y}&w=${w}&h=${h}&vx=${vx}&vy=${vy}&s=${sp}&live=${liveFlag}`);
    this.sentCount++;
    if (this.sentCount <= 3 || this.sentCount % 20 === 0) {
      addLog(`📡 x=${x} y=${y} w=${w} h=${h}`);
    }
  },
  stop() {
    if (!this.ip) return;
    const img = new Image();
    img.src = `http://${this.ip}/t?live=0&_=${Date.now()}`;
    addLog('⏹ إبلاغ ESP بالتوقف');
  },
  _fire(url) {
    const self = this;
    const img = new Image();
    img.onload = img.onerror = () => { self.ok = true; self.fails = 0; updateEspUI(); };
    img.src = url + '&_=' + Date.now();
    clearTimeout(self.timer);
    self.timer = setTimeout(() => {
      self.fails++;
      if (self.fails >= 3 && self.ok) {
        self.ok = false;
        addLog('⚠ فُقد الاتصال بـ ESP', true);
        updateEspUI();
      }
    }, 400);
  }
};
function updateEspUI() {
  const dot = $('espDot'), btn = $('espBtn');
  if (!dot) return;
  dot.className = 'espDot ' + (espSender.enabled ? (espSender.ok ? 'on' : 'off') : '');
  if (espSender.enabled && !espSender.ok && espSender.fails < 3) dot.className = 'espDot mid';
  btn.classList.toggle('off', !espSender.enabled);
  btn.textContent = espSender.enabled ? 'قطع' : 'ربط';
}
$('espBtn').addEventListener('click', e => {
  e.stopPropagation();
  const ip = $('espIP');
  if (espSender.enabled) {
    espSender.enabled = false; espSender.ok = false;
    addLog('⏹ قطع الاتصال');
    espSender.stop();
    updateEspUI();
    return;
  }
  const v = ip.value.trim();
  if (!v) { ip.focus(); return; }
  espSender.setIP(v);
  espSender.enabled = true; espSender.fails = 0; espSender.sentCount = 0;
  addLog('🔗 محاولة الاتصال بـ ' + v);
  espSender.ping();
  updateEspUI();
});
$('espIP').addEventListener('keypress', e => { if (e.key === 'Enter') $('espBtn').click(); });
if (espSender.ip) $('espIP').value = espSender.ip;
updateEspUI();

// ═══════════════════════════════════════════════
//  الأدوات
// ═══════════════════════════════════════════════
function resize() {
  const r = wrap.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 350));
resize();

function fit() {
  const r = wrap.getBoundingClientRect();
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const scale = Math.max(r.width / vw, r.height / vh);
  return { scale, ox: (r.width - vw * scale) / 2, oy: (r.height - vh * scale) / 2, vw, vh, w: r.width, h: r.height };
}

// ✅ شاشة → إحداثيات محلية (كانفس) — نزيل الزوم
function screenToLocal(clientX, clientY) {
  const r = wrap.getBoundingClientRect();
  const W = r.width, H = r.height;
  const lx = W/2 + (clientX - r.left - W/2) / zoom;
  const ly = H/2 + (clientY - r.top  - H/2) / zoom;
  return [lx, ly];
}
function localToVideo(lx, ly) {
  const f = fit();
  return [(lx - f.ox) / f.scale, (ly - f.oy) / f.scale];
}
// ✅ الفيديو → إحداثيات محلية (كانفس) — بدون زوم (الزوم يأتي من CSS على الحاوية)
function videoToLocal(vx, vy) {
  const f = fit();
  return [f.ox + vx * f.scale, f.oy + vy * f.scale];
}
function videoToGray(x, y) {
  return [x * grayW / (video.videoWidth || 640), y * grayH / (video.videoHeight || 480)];
}

// ═══════════════════════════════════════════════
//  الصورة الرمادية
// ═══════════════════════════════════════════════
function initGrayCanvas() {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  if (vw >= vh) { grayW = CFG.grayMaxDim; grayH = Math.round(CFG.grayMaxDim * vh / vw); }
  else { grayH = CFG.grayMaxDim; grayW = Math.round(CFG.grayMaxDim * vw / vh); }
  grayCanvas.width = grayW; grayCanvas.height = grayH;
  grayData = null;
}
function grabGray() {
  if (video.readyState < 2) return null;
  if (grayCanvas.width !== grayW || grayCanvas.height !== grayH) initGrayCanvas();
  grayCtx.drawImage(video, 0, 0, grayW, grayH);
  const img = grayCtx.getImageData(0, 0, grayW, grayH);
  if (!grayData || grayData.length !== img.data.length) grayData = new Uint8ClampedArray(img.data.length);
  grayData.set(img.data);
  return grayData;
}
function extractRegion(gray, cx, cy, regionSize, out) {
  const P = CFG.patchSize;
  const half = regionSize * 0.5;
  const step = regionSize / P;
  const x0 = cx - half, y0 = cy - half;
  const W = grayW, H = grayH;
  let k = 0;
  for (let py = 0; py < P; py++) {
    const sy = (y0 + py * step) | 0;
    if (sy < 0 || sy >= H) { k += P; continue; }
    const rowBase = sy * W * 4;
    for (let px = 0; px < P; px++) {
      const sx = (x0 + px * step) | 0;
      if (sx >= 0 && sx < W) {
        const idx = rowBase + sx * 4;
        out[k] = (gray[idx] * 77 + gray[idx + 1] * 150 + gray[idx + 2] * 29) >> 8;
      }
      k++;
    }
  }
  return out;
}
function sad(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d < 0 ? -d : d; }
  return s;
}

// ═══════════════════════════════════════════════
//  القفل
// ═══════════════════════════════════════════════
function lockAt(clientX, clientY) {
  const [lx, ly] = screenToLocal(clientX, clientY);
  const [vx, vy] = localToVideo(lx, ly);
  const [gx, gy] = videoToGray(vx, vy);
  const gray = grabGray();
  if (!gray) return;
  const temp = new Uint8Array(CFG.patchSize * CFG.patchSize);
  extractRegion(gray, gx, gy, CFG.initRegion, temp);
  tracked = {
    template: temp.slice(),
    cx: gx, cy: gy,
    scale: CFG.initRegion / CFG.patchSize,
    initRegionSize: CFG.initRegion,
    lastSeen: performance.now(),
    velocity: [0, 0],
    sad: 0, live: true, lostCount: 0
  };
  hint.style.display = 'none';
  resetBtn.style.display = 'flex';
  recenterBtn.style.display = 'flex';
  panel.style.display = 'block';
  logBox.style.display = 'flex';
  hud.textContent = '🎯 مقفل';
  setStatus('✅ تم القفل', 1500);
  addLog('🎯 قفل على كائن');
}
function unlock() {
  if (!tracked) return;
  tracked = null;
  resetBtn.style.display = 'none';
  recenterBtn.style.display = 'none';
  panel.style.display = 'none';
  hud.textContent = 'MokTrak Pro · جاهز';
  setStatus('إلغاء القفل', 1200);
  addLog('✕ إلغاء القفل');
  espSender.stop();
}

// ═══════════════════════════════════════════════
//  التتبع — دائم
// ═══════════════════════════════════════════════
function trackStep(now) {
  if (!tracked) return;
  const gray = grabGray();
  if (!gray) return;
  const P = CFG.patchSize;
  const template = tracked.template;
  const baseX = tracked.cx, baseY = tracked.cy, baseScale = tracked.scale;
  const regionBase = P * baseScale;
  let best = { sad: Infinity, x: baseX, y: baseY, scale: baseScale };
  const lost = tracked.lostCount > CFG.lostFramesToWarn;
  const R = lost ? CFG.searchRadiusLost : CFG.searchRadius;
  const step = lost ? CFG.coarseStepLost : CFG.coarseStep;
  for (let dy = -R; dy <= R; dy += step) {
    for (let dx = -R; dx <= R; dx += step) {
      extractRegion(gray, baseX + dx, baseY + dy, regionBase, scratchRegion);
      const s = sad(template, scratchRegion);
      if (s < best.sad) { best.sad = s; best.x = baseX + dx; best.y = baseY + dy; best.scale = baseScale; }
    }
  }
  const FR = CFG.fineRadius, cx0 = best.x, cy0 = best.y;
  for (let dy = -FR; dy <= FR; dy++) {
    for (let dx = -FR; dx <= FR; dx++) {
      if (dx === 0 && dy === 0) continue;
      extractRegion(gray, cx0 + dx, cy0 + dy, regionBase, scratchRegion);
      const s = sad(template, scratchRegion);
      if (s < best.sad) { best.sad = s; best.x = cx0 + dx; best.y = cy0 + dy; }
    }
  }
  for (let i = 0; i < CFG.scales.length; i++) {
    const sc = CFG.scales[i];
    if (Math.abs(sc - baseScale) < 0.04) continue;
    extractRegion(gray, best.x, best.y, P * sc, scratchRegion);
    const s = sad(template, scratchRegion);
    if (s < best.sad * 0.92) { best.sad = s; best.scale = sc; }
  }
  if (best.sad < CFG.minSAD) {
    const a = CFG.posSmoothing;
    const newX = tracked.cx * (1 - a) + best.x * a;
    const newY = tracked.cy * (1 - a) + best.y * a;
    const sA = CFG.sizeSmoothing;
    const newScale = tracked.scale * sA + best.scale * (1 - sA);
    tracked.velocity = [
      tracked.velocity[0] * 0.55 + (newX - tracked.cx) * 0.45,
      tracked.velocity[1] * 0.55 + (newY - tracked.cy) * 0.45
    ];
    tracked.cx = newX; tracked.cy = newY;
    tracked.scale = Math.max(CFG.minScale, Math.min(CFG.maxScale, newScale));
    tracked.lastSeen = now;
    tracked.sad = best.sad;
    tracked.live = true;
    tracked.lostCount = 0;
    if (best.sad < CFG.bestSAD && frameCount % CFG.templateUpdateEvery === 0) {
      const region = new Uint8Array(P * P);
      extractRegion(gray, tracked.cx, tracked.cy, P * tracked.scale, region);
      const tpl = tracked.template;
      for (let i = 0; i < tpl.length; i++) tpl[i] = (tpl[i] * 7 + region[i]) >> 3;
    }
  } else {
    tracked.lostCount++;
    tracked.cx += tracked.velocity[0];
    tracked.cy += tracked.velocity[1];
    tracked.velocity[0] *= 0.9;
    tracked.velocity[1] *= 0.9;
    if (tracked.lostCount >= CFG.lostFramesToWarn && tracked.live) {
      tracked.live = false;
      addLog('⚠ الهدف مفقود — القفل محفوظ');
    }
  }
}

// ═══════════════════════════════════════════════
//  اللمس — pinch + double-tap
// ═══════════════════════════════════════════════
function setZoom(z, fromPinch) {
  const nz = Math.max(CFG.zoomMin, Math.min(CFG.zoomMax, z));
  if (Math.abs(nz - zoom) < 0.001) return;
  zoom = nz;
  // أثناء pinch: بدون transition (استجابة فورية)
  if (fromPinch) videoWrap.style.transition = 'none';
  else videoWrap.style.transition = 'transform .15s ease-out';
  videoWrap.style.transform = `scale(${zoom})`;
  zoomBadge.textContent = zoom.toFixed(2) + '×';
  zoomBadge.style.display = 'block';
  clearTimeout(setZoom._t);
  setZoom._t = setTimeout(() => { zoomBadge.style.display = 'none'; }, 1200);
}

canvas.addEventListener('pointerdown', e => {
  if (!running) return;
  try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pointers.size === 2) {
    isPinching = true;
    pinchStartDist = getTwoPointerDistance();
    pinchStartZoom = zoom;
    pointerStart = null;
    lastTap = null;
  } else if (pointers.size === 1) {
    pointerStart = { x: e.clientX, y: e.clientY, t: performance.now() };
  }
});

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (isPinching && pointers.size === 2 && pinchStartDist > 0) {
    const d = getTwoPointerDistance();
    const factor = d / pinchStartDist;
    setZoom(pinchStartZoom * factor, true);
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}

  if (pointers.size < 2) {
    if (isPinching) {
      // انتهاء pinch — أعِد الـ transition
      videoWrap.style.transition = 'transform .15s ease-out';
    }
    isPinching = false;
    pinchStartDist = 0;
  }
  if (pointers.size === 0 && !isPinching && pointerStart) {
    const dx = e.clientX - pointerStart.x;
    const dy = e.clientY - pointerStart.y;
    const moved = Math.hypot(dx, dy);
    const dt = performance.now() - pointerStart.t;
    pointerStart = null;
    if (moved > CFG.tapMoveThreshold || dt > CFG.tapMaxDuration) return;
    const now = performance.now();
    if (lastTap && (now - lastTap.time) < CFG.doubleTapMs &&
        Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < CFG.doubleTapRadiusPx) {
      if (tracked) unlock();
      lockAt(e.clientX, e.clientY);
      lastTap = null;
      return;
    }
    lastTap = { x: e.clientX, y: e.clientY, time: now };
  } else if (pointers.size === 0) {
    pointerStart = null;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

zoomInBtn.addEventListener('click', e => { e.stopPropagation(); setZoom(zoom * 1.25, false); });
zoomOutBtn.addEventListener('click', e => { e.stopPropagation(); setZoom(zoom / 1.25, false); });
recenterBtn.addEventListener('click', e => {
  e.stopPropagation();
  setZoom(1.0, false);
  addLog('⌖ إعادة ضبط الزوم');
});

// ═══════════════════════════════════════════════
//  التسجيل
// ═══════════════════════════════════════════════
function pickMime() {
  const types = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const t of types) if (MediaRecorder.isTypeSupported(t)) return t;
  return '';
}
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
}
function startRecording() {
  if (recording || !running) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  let CW = vw, CH = vh;
  if (Math.max(CW, CH) > CFG.recMaxDim) {
    const k = CFG.recMaxDim / Math.max(CW, CH);
    CW = Math.round(CW * k); CH = Math.round(CH * k);
  }
  recCanvas.width = CW; recCanvas.height = CH;
  const streamFromCanvas = recCanvas.captureStream(30);
  const mime = pickMime();
  try {
    recorder = new MediaRecorder(streamFromCanvas, mime ? { mimeType: mime, videoBitsPerSecond: 3000000 } : undefined);
  } catch (e) { showError('التسجيل غير مدعوم: ' + e.message); return; }
  recChunks = [];
  recorder.ondataavailable = ev => { if (ev.data && ev.data.size > 0) recChunks.push(ev.data); };
  recorder.onstop = () => {
    if (recChunks.length === 0) { addLog('⚠ لا توجد بيانات', true); return; }
    const blob = new Blob(recChunks, { type: mime || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ext = (mime && mime.includes('mp4')) ? 'mp4' : 'webm';
    a.href = url; a.download = `MokTrak_${Date.now()}.${ext}`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    addLog('✅ حُفظ الفيديو');
    setStatus('✅ حُفظ التسجيل', 2500);
  };
  recorder.start(1000);
  recording = true;
  recStartTime = performance.now();
  recordBtn.classList.add('on');
  recIndicator.style.display = 'flex';
  recTimer = setInterval(() => { recTime.textContent = fmtTime(performance.now() - recStartTime); }, 500);
  addLog('⏺ بدأ التسجيل');
  setStatus('⏺ بدأ التسجيل', 1500);
}
function stopRecording() {
  if (!recording || !recorder) return;
  try { recorder.stop(); } catch (e) {}
  recording = false;
  recordBtn.classList.remove('on');
  recIndicator.style.display = 'none';
  clearInterval(recTimer);
  recorder = null;
  addLog('⏹ إيقاف التسجيل');
}
recordBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (recording) stopRecording(); else startRecording();
});

function drawForRecording() {
  if (!recording || !recCanvas.width) return;
  const CW = recCanvas.width, CH = recCanvas.height;
  const VW = video.videoWidth, VH = video.videoHeight;
  const Z = zoom;
  const srcW = VW / Z, srcH = VH / Z;
  const srcX = (VW - srcW) / 2, srcY = (VH - srcH) / 2;
  recCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, CW, CH);
  if (tracked) {
    const vScaleX = VW / grayW, vScaleY = VH / grayH;
    const ovx = tracked.cx * vScaleX, ovy = tracked.cy * vScaleY;
    const ovw = CFG.patchSize * tracked.scale * vScaleX;
    const ovh = CFG.patchSize * tracked.scale * vScaleY;
    const kx = CW / srcW, ky = CH / srcH;
    const bx = (ovx - ovw/2 - srcX) * kx, by = (ovy - ovh/2 - srcY) * ky;
    const bw = ovw * kx, bh = ovh * ky;
    if (tracked.live) {
      recCtx.strokeStyle = '#00ff88';
      recCtx.lineWidth = Math.max(2, Math.min(CW, CH) * 0.005);
      recCtx.shadowColor = '#00ff88'; recCtx.shadowBlur = 8;
      recCtx.strokeRect(bx, by, bw, bh);
      recCtx.shadowBlur = 0;
      const ccx = bx + bw/2, ccy = by + bh/2;
      const cs = Math.max(10, Math.min(bw, bh) * 0.2);
      recCtx.beginPath();
      recCtx.moveTo(ccx - cs, ccy); recCtx.lineTo(ccx - cs/3, ccy);
      recCtx.moveTo(ccx + cs/3, ccy); recCtx.lineTo(ccx + cs, ccy);
      recCtx.moveTo(ccx, ccy - cs); recCtx.lineTo(ccx, ccy - cs/3);
      recCtx.moveTo(ccx, ccy + cs/3); recCtx.lineTo(ccx, ccy + cs);
      recCtx.stroke();
    }
  }
  recCtx.strokeStyle = 'rgba(255,235,59,.9)';
  recCtx.lineWidth = 2;
  const mcx = CW/2, mcy = CH/2;
  recCtx.beginPath();
  recCtx.moveTo(mcx-12, mcy); recCtx.lineTo(mcx-4, mcy);
  recCtx.moveTo(mcx+4, mcy); recCtx.lineTo(mcx+12, mcy);
  recCtx.moveTo(mcx, mcy-12); recCtx.lineTo(mcx, mcy-4);
  recCtx.moveTo(mcx, mcy+4); recCtx.lineTo(mcx, mcy+12);
  recCtx.stroke();
}

// ═══════════════════════════════════════════════
//  الرسم
// ═══════════════════════════════════════════════
function drawCross(cx, cy, size, live) {
  ctx.save();
  ctx.strokeStyle = live ? '#00ff88' : '#ffca28';
  ctx.fillStyle = ctx.strokeStyle;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = live ? 9 : 3;
  ctx.lineWidth = 2;
  const g = size * .28, a = size;
  ctx.beginPath();
  ctx.moveTo(cx-a, cy); ctx.lineTo(cx-g, cy);
  ctx.moveTo(cx+g, cy); ctx.lineTo(cx+a, cy);
  ctx.moveTo(cx, cy-a); ctx.lineTo(cx, cy-g);
  ctx.moveTo(cx, cy+g); ctx.lineTo(cx, cy+a);
  ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, g*.9, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI*2); ctx.fill();
  ctx.lineWidth = 2;
  for (let k = 0; k < 4; k++) {
    const ang = k*Math.PI/2 + Math.PI/4;
    ctx.beginPath(); ctx.arc(cx, cy, a+4, ang-.18, ang+.18); ctx.stroke();
  }
  ctx.restore();
}
function drawCenterMarker(cx, cy) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,235,59,.85)';
  ctx.fillStyle = 'rgba(255,235,59,.85)';
  ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 6;
  ctx.lineWidth = 1.5;
  const s = 12, g = 4;
  ctx.beginPath();
  ctx.moveTo(cx-s, cy); ctx.lineTo(cx-g, cy);
  ctx.moveTo(cx+g, cy); ctx.lineTo(cx+s, cy);
  ctx.moveTo(cx, cy-s); ctx.lineTo(cx, cy-g);
  ctx.moveTo(cx, cy+g); ctx.lineTo(cx, cy+s);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ✅ يستخدم videoToLocal بدون زوم (لأن الحاوية مضروبة بالزوم في CSS)
function drawTracked() {
  const f = fit();
  const vScaleX = (video.videoWidth || 640) / grayW;
  const vScaleY = (video.videoHeight || 480) / grayH;
  if (tracked) {
    const regionPx = CFG.patchSize * tracked.scale;
    const vx = tracked.cx * vScaleX, vy = tracked.cy * vScaleY;
    const vw = regionPx * vScaleX, vh = regionPx * vScaleY;
    const [bx, by] = videoToLocal(vx - vw/2, vy - vh/2);
    const [bx2, by2] = videoToLocal(vx + vw/2, vy + vh/2);
    const bw = bx2 - bx, bh = by2 - by;
    const objCx = bx + bw/2, objCy = by + bh/2;
    const scx = f.w/2, scy = f.h/2;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,235,59,.4)';
    ctx.lineWidth = 1.2; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(scx, scy); ctx.lineTo(objCx, objCy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = tracked.live ? '#00ff88' : '#ffca28';
    ctx.lineWidth = 1.8;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = tracked.live ? 8 : 3;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.shadowBlur = 0;
    const cl = Math.min(bw, bh) * 0.18;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(bx, by+cl); ctx.lineTo(bx, by); ctx.lineTo(bx+cl, by);
    ctx.moveTo(bx+bw-cl, by); ctx.lineTo(bx+bw, by); ctx.lineTo(bx+bw, by+cl);
    ctx.moveTo(bx+bw, by+bh-cl); ctx.lineTo(bx+bw, by+bh); ctx.lineTo(bx+bw-cl, by+bh);
    ctx.moveTo(bx+cl, by+bh); ctx.lineTo(bx, by+bh); ctx.lineTo(bx, by+bh-cl);
    ctx.stroke();
    ctx.restore();
    const crossSize = Math.max(12, Math.min(bw, bh) * 0.18);
    drawCross(objCx, objCy, crossSize, tracked.live);
  }
  drawCenterMarker(f.w/2, f.h/2);
}
// ✅ drawPendingTap يقسم على zoom (لأن الإحداثيات على الشاشة)
function drawPendingTap(now) {
  if (!lastTap) return;
  const age = now - lastTap.time;
  if (age > CFG.doubleTapMs) return;
  const r = canvas.getBoundingClientRect();
  const x = (lastTap.x - r.left) / zoom;
  const y = (lastTap.y - r.top) / zoom;
  const alpha = 1 - age / CFG.doubleTapMs;
  ctx.save();
  ctx.strokeStyle = `rgba(255,235,59,${alpha})`;
  ctx.lineWidth = 2 / zoom;
  ctx.beginPath(); ctx.arc(x, y, (12 + (1-alpha)*12) / zoom, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 3 / zoom, 0, Math.PI*2);
  ctx.fillStyle = `rgba(255,235,59,${alpha})`;
  ctx.fill();
  ctx.restore();
}
function updatePanel(now) {
  if (!tracked) return;
  const vScaleX = (video.videoWidth || 640) / grayW;
  const vScaleY = (video.videoHeight || 480) / grayH;
  const vcx = tracked.cx * vScaleX, vcy = tracked.cy * vScaleY;
  const relX = vcx - (video.videoWidth / 2);
  const relY = vcy - (video.videoHeight / 2);
  const vw = CFG.patchSize * tracked.scale * vScaleX;
  const vh = CFG.patchSize * tracked.scale * vScaleY;
  const vvx = tracked.velocity[0] * vScaleX;
  const vvy = tracked.velocity[1] * vScaleY;
  const speed = Math.hypot(vvx, vvy);
  const age = now - tracked.lastSeen;
  let status = 'نشط', cls = 'good';
  if (!tracked.live) { status = 'مفقود'; cls = 'bad'; }
  else if (age > 300) { status = 'استعادة'; cls = 'warn'; }
  panel.innerHTML =
    '<div class="title">🎯 الهدف</div>' +
    '<div class="row"><span class="k">الحالة</span><span class="'+cls+'">'+status+'</span></div>' +
    '<div class="row"><span class="k">x</span><span class="v">'+relX.toFixed(0)+'</span></div>' +
    '<div class="row"><span class="k">y</span><span class="v">'+relY.toFixed(0)+'</span></div>' +
    '<div class="row"><span class="k">w×h</span><span class="v">'+vw.toFixed(0)+'×'+vh.toFixed(0)+'</span></div>' +
    '<div class="row"><span class="k">سرعة</span><span class="v">'+speed.toFixed(0)+'</span></div>' +
    '<div class="row"><span class="k">زوم</span><span class="v">'+zoom.toFixed(2)+'×</span></div>' +
    '<div class="row"><span class="k">SAD</span><span class="v">'+tracked.sad.toFixed(0)+'</span></div>' +
    '<div class="row"><span class="k">ESP</span><span class="v">'+(espSender.ok?'✅':'⏸')+'</span></div>';
  espSender.send();
}
function render(now) {
  const r = wrap.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  drawTracked();
  drawPendingTap(now);
  if (tracked) updatePanel(now);
}

function loop() {
  if (!running) return;
  const now = performance.now();
  fpsN++;
  if (now - fpsT >= 1000) {
    fps = fpsN * 1000 / (now - fpsT);
    fpsEl.textContent = fps.toFixed(0) + ' fps';
    fpsN = 0; fpsT = now;
  }
  if (video.readyState >= 2 && now - lastFrame > CFG.frameIntervalMs) {
    lastFrame = now;
    frameCount++;
    if (tracked) trackStep(now);
    render(now);
    if (recording) drawForRecording();
  }
  rafId = requestAnimationFrame(loop);
}

async function start() {
  startBtn.disabled = true;
  startBtn.textContent = 'جارٍ التشغيل…';
  hideError();
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('الكاميرا تحتاج HTTPS.');
    }
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1280 }, height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 }
      }
    });
    video.srcObject = stream;
    await new Promise((res, rej) => {
      if (video.readyState >= 1) { res(); return; }
      video.onloadedmetadata = res;
      setTimeout(() => rej(new Error('انتهت مهلة الكاميرا')), 10000);
    });
    await video.play();
    initGrayCanvas();
    resize();
    running = true;
    startBtn.style.display = 'none';
    bottomBar.style.display = 'flex';
    $('espBar').style.display = 'flex';
    logBox.style.display = 'flex';
    hud.textContent = 'MokTrak Pro · جاهز';
    hint.style.display = 'block';
    setTimeout(() => { if (!tracked) hint.style.display = 'none'; }, 6000);
    addLog('▶ تشغيل الكاميرا');
    addLog('🔒 يعمل بدون إنترنت');
    loop();
  } catch (e) {
    showError('تعذر التشغيل: ' + (e.message || e) + '\n\nتأكد من:\n• السماح بالكاميرا\n• فتح الرابط عبر HTTPS');
    hud.textContent = 'تعذر التشغيل';
    startBtn.disabled = false;
    startBtn.textContent = '↻ إعادة المحاولة';
  }
}
async function switchCamera() {
  if (!running) return;
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) stream.getTracks().forEach(t => t.stop());
  running = false;
  cancelAnimationFrame(rafId);
  unlock();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1280 }, height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 }
      }
    });
    video.srcObject = stream;
    await video.play();
    initGrayCanvas();
    running = true;
    frameCount = 0;
    addLog('🔄 تبديل الكاميرا');
    loop();
  } catch (e) {
    showError('تعذر تبديل الكاميرا: ' + e.message);
    running = false;
  }
}
startBtn.addEventListener('click', start);
switchBtn.addEventListener('click', e => { e.stopPropagation(); switchCamera(); });
resetBtn.addEventListener('click', e => { e.stopPropagation(); unlock(); });

function stopAll() {
  if (running) {
    running = false;
    cancelAnimationFrame(rafId);
    rafId = 0;
  }
  if (recording) { try { stopRecording(); } catch(e) {} }
  if (stream) {
    try { stream.getTracks().forEach(t => { try { t.stop(); } catch(e) {} }); } catch(e) {}
    stream = null;
  }
  if (video) {
    try { video.pause(); } catch(e) {}
    try { video.srcObject = null; } catch(e) {}
    try { video.load(); } catch(e) {}
  }
  if (espSender.enabled && espSender.ip) {
    try {
      const img = new Image();
      img.src = `http://${espSender.ip}/t?live=0&_=${Date.now()}`;
    } catch(e) {}
  }
  if (startBtn) {
    startBtn.disabled = false;
    startBtn.textContent = '▶ تشغيل الكاميرا';
    startBtn.style.display = 'block';
  }
  if (bottomBar) bottomBar.style.display = 'none';
  if ($('espBar')) $('espBar').style.display = 'none';
  if (logBox) logBox.style.display = 'none';
  if (panel) panel.style.display = 'none';
  tracked = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (document.hidden && running) {
        addLog('⏸ الصفحة مخفية — إيقاف');
        stopAll();
      }
    }, CFG.hideGraceMs);
  } else {
    clearTimeout(hideTimer);
  }
});
window.addEventListener('pagehide', () => stopAll());
window.addEventListener('beforeunload', () => stopAll());
window.addEventListener('unload', () => stopAll());

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
})();
