<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Trackvid</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#wrap{width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#wrap{position:relative;overflow:hidden}
#videoWrap{position:absolute;inset:0;transform-origin:center center;will-change:transform}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud,#fps{position:absolute;z-index:5;color:#00ff88;background:rgba(0,0,0,0.4);border:1px solid #00ff8844;border-radius:14px;font:600 11px monospace;padding:6px 9px;text-shadow:0 1px 3px #000;backdrop-filter:blur(6px)}
#hud{top:10px;right:10px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fps{top:10px;left:10px}
#hint{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:rgba(0,0,0,0.6);border:1px solid #00ff88;color:#00ff88;padding:12px 20px;border-radius:20px;text-align:center;font-size:13px;max-width:85%;line-height:1.6;backdrop-filter:blur(8px)}

/* ═══ لوحة PID شفافة ═══ */
#panel{
  position:absolute;z-index:5;right:8px;top:38%;transform:translateY(-50%);
  display:none;pointer-events:none;min-width:120px;max-width:142px;
  background:transparent;border:none;border-radius:0;padding:6px 8px;
  color:#fff;font:12px ui-monospace,monospace;line-height:1.5;
  text-shadow:0 0 8px rgba(0,0,0,1),0 0 4px rgba(0,0,0,1),0 0 2px rgba(0,0,0,1),1px 1px 2px rgba(0,0,0,1),-1px -1px 2px rgba(0,0,0,1)
}
#panel .title{font-weight:800;color:#ff5252;padding-bottom:3px;margin-bottom:4px;font-size:12px;text-align:center;border-bottom:1px solid rgba(255,82,82,0.15)}
#panel .title.manual{color:#00e5ff;border-color:rgba(0,229,255,0.2)}
#panel .row{display:flex;justify-content:space-between;gap:6px;margin:2px 0}
#panel .k{color:rgba(0,255,136,0.9);font-size:11px}
#panel .v{color:#fff;font-weight:700;font-size:13px}
#panel .sep{height:0;margin:4px 0}

/* ═══ Joystick ═══ */
#joystick{
  position:absolute;z-index:8;left:14px;bottom:88px;
  width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,30,18,0.5) 0%,rgba(0,20,12,0.3) 70%,rgba(0,0,0,0.15) 100%);
  border:2px solid rgba(0,255,136,0.4);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  touch-action:none;display:none;user-select:none;
  box-shadow:0 0 20px rgba(0,255,136,0.15),inset 0 0 30px rgba(0,255,136,0.05)
}
#joystick.active{border-color:rgba(0,255,136,0.9);box-shadow:0 0 30px rgba(0,255,136,0.4),inset 0 0 40px rgba(0,255,136,0.1)}
#joystickKnob{
  position:absolute;left:50%;top:50%;width:56px;height:56px;
  margin-left:-28px;margin-top:-28px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(0,255,136,0.9),rgba(0,200,100,0.6));
  border:2px solid #00ff88;
  box-shadow:0 0 14px rgba(0,255,136,0.6),inset 0 0 8px rgba(255,255,255,0.3);
  pointer-events:none;transition:transform 0.15s ease-out
}
#joystick.active #joystickKnob{transition:none;box-shadow:0 0 24px rgba(0,255,136,0.9),inset 0 0 10px rgba(255,255,255,0.5)}
#joystick .centerMark{
  position:absolute;left:50%;top:50%;width:8px;height:8px;margin-left:-4px;margin-top:-4px;
  border-radius:50%;background:rgba(0,255,136,0.35);pointer-events:none
}
#joystick .arrow{position:absolute;color:rgba(0,255,136,0.45);font-size:15px;font-weight:bold;pointer-events:none;text-shadow:0 0 6px rgba(0,255,136,0.5)}
#joystick .arrow.up{left:50%;top:5px;transform:translateX(-50%)}
#joystick .arrow.down{left:50%;bottom:5px;transform:translateX(-50%)}
#joystick .arrow.left{left:7px;top:50%;transform:translateY(-50%)}
#joystick .arrow.right{right:7px;top:50%;transform:translateY(-50%)}
#joystick .label{
  position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
  color:rgba(0,255,136,0.6);font:600 10px ui-monospace,monospace;white-space:nowrap
}

button{font-family:system-ui,sans-serif;font-weight:700;cursor:pointer;border:0}
#startBtn{position:absolute;z-index:8;bottom:28px;left:50%;transform:translateX(-50%);border-radius:28px;background:#00ff88;color:#00180d;padding:15px 26px;font-size:16px;box-shadow:0 5px 24px #00ff8844;white-space:nowrap}
#startBtn:disabled{opacity:.7}
#bottomBar{position:absolute;z-index:7;bottom:14px;right:0;left:auto;display:none;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:0 10px;max-width:65%}
.ctrlBtn{min-width:56px;height:52px;padding:0 16px;border-radius:26px;background:rgba(0,26,16,0.55);border:1.5px solid #00ff8866;color:#00ff88;font-size:16px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);gap:6px}
.ctrlBtn:active{transform:scale(.94)}
.ctrlBtn.select{background:#00ff88;color:#00180d;font-weight:800}
.ctrlBtn.rec{background:#ff1744;border-color:#ff1744;color:#fff}
.ctrlBtn.rec.on{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff174488}50%{box-shadow:0 0 0 12px #ff174400}}
#espBar{position:absolute;z-index:7;top:80px;right:10px;display:none;gap:6px;align-items:center;background:rgba(0,0,0,0.20);border:1px solid rgba(0,255,136,0.25);border-radius:14px;padding:6px 9px;font:600 10px monospace;backdrop-filter:blur(6px);flex-wrap:wrap;max-width:80%}
#espBar input{background:rgba(0,26,16,0.6);border:1px solid #00ff8855;border-radius:8px;color:#00ff88;padding:4px 7px;font:600 10px monospace;width:96px;outline:none}
#espBar input:focus{border-color:#00ff88}
#espBtn{background:#00ff88;color:#00180d;border-radius:8px;padding:5px 10px;font:700 10px system-ui}
#espBtn.off{background:#444;color:#aaa}
#espDot{width:8px;height:8px;border-radius:50%;background:#666;flex-shrink:0}
#espDot.on{background:#00ff88;box-shadow:0 0 8px #00ff88}
#espDot.off{background:#ff5252}
#espDot.mid{background:#ffca28}
#statusBar{position:absolute;z-index:6;top:42px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);color:#00ff88;font:600 10px monospace;padding:5px 12px;border-radius:10px;border:1px solid rgba(0,255,136,0.3);display:none;max-width:90%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(6px)}
#logBox{position:absolute;z-index:5;bottom:260px;left:10px;right:120px;max-height:100px;display:none;flex-direction:column-reverse;gap:2px;overflow:hidden;pointer-events:none}
.logLine{background:rgba(0,0,0,0.20);border:1px solid rgba(0,255,136,0.20);border-radius:6px;padding:3px 8px;color:#00ff88;font:600 10px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 4px rgba(0,0,0,1);backdrop-filter:blur(4px);animation:fadeIn .3s}
.logLine.err{border-color:#ff5252;color:#ff7777}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#err{display:none;position:absolute;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:440px;background:rgba(24,0,0,0.95);border:1px solid #ff5252;border-radius:12px;padding:16px;color:#ff7777;font-size:13px;line-height:1.6;white-space:pre-wrap}
#recIndicator{position:absolute;z-index:9;top:10px;left:50%;transform:translateX(-50%);background:#ff1744;color:#fff;font:700 11px monospace;padding:6px 12px;border-radius:14px;display:none;align-items:center;gap:6px}
#recIndicator::before{content:'';width:8px;height:8px;border-radius:4px;background:#fff;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#zoomBadge{position:absolute;z-index:6;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.3);color:#00ff88;font:700 12px monospace;padding:6px 10px;border-radius:12px;border:1px solid rgba(0,255,136,0.25);display:none;backdrop-filter:blur(6px);text-shadow:0 1px 3px #000}
#sensorBadge{position:absolute;z-index:6;bottom:56px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.3);color:#00ff88;font:600 10px monospace;padding:4px 8px;border-radius:10px;border:1px solid rgba(0,255,136,0.2);display:none;backdrop-filter:blur(6px);text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap">
  <div id="videoWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="hud">Trackvid · جاهز</div>
  <div id="fps">-- fps</div>
  <div id="zoomBadge">1.0×</div>
  <div id="sensorBadge">📡 غير مفعّل</div>
  <div id="statusBar"></div>
  <div id="recIndicator">● تسجيل <span id="recTime">00:00</span></div>
  <div id="hint">ضع الكائن داخل المربع الأخضر ثم اضغط "تحديد"</div>
  <div id="panel"></div>
  <div id="logBox"></div>

  <!-- 🎮 Joystick -->
  <div id="joystick">
    <div class="arrow up">▲</div>
    <div class="arrow down">▼</div>
    <div class="arrow left">◀</div>
    <div class="arrow right">▶</div>
    <div class="centerMark"></div>
    <div id="joystickKnob"></div>
    <div class="label">🎮 تحكم يدوي</div>
  </div>

  <div id="espBar">
    <span id="espDot"></span>
    <input id="espIP" type="text" placeholder="192.168.4.1" inputmode="numeric">
    <button id="espBtn" class="off">ربط</button>
  </div>

  <div id="bottomBar">
    <button class="ctrlBtn" id="zoomOutBtn" title="تصغير">−</button>
    <button class="ctrlBtn" id="zoomInBtn" title="تكبير">+</button>
    <button class="ctrlBtn select" id="selectBtn" title="تحديد">🔴 تحديد</button>
    <button class="ctrlBtn" id="resetBtn" title="إلغاء">✕</button>
    <button class="ctrlBtn rec" id="recordBtn" title="تسجيل">●</button>
    <button class="ctrlBtn" id="switchBtn" title="تبديل">⟳</button>
  </div>

  <button id="startBtn">▶ تشغيل الكاميرا</button>
  <div id="err"></div>
</div>

<script>
(function(){
'use strict';

const CFG = {
  patchSize: 22, initRegion: 30,
  searchRadius: 22, coarseStep: 3, fineRadius: 3,
  searchRadiusLost: 70, coarseStepLost: 7,
  scales: [0.35, 0.5, 0.65, 0.8, 0.92, 1.0, 1.1, 1.25, 1.45, 1.7, 2.0, 2.4],
  minScale: 0.3, maxScale: 3.0,
  minSAD: 3200, bestSAD: 900,
  posSmoothing: 0.55, sizeSmoothing: 0.85,
  grayMaxDim: 480, frameIntervalMs: 25,
  templateUpdateEvery: 8,
  lostFramesToWarn: 20,
  boxScreenRatio: 0.42,
  zoomMin: 1.0, zoomMax: 8.0,
  recMaxDim: 720,
  sensorWeight: 0.35, gyroScale: 6.0,
  panKp: 0.06, panKi: 0.008, panKd: 0.015,
  tiltKp: 0.06, tiltKi: 0.008, tiltKd: 0.015,
  pidIntegralLimit: 200,
  maxStep: 3.0,
  deadzone: 15,
  panMin: 10, panMax: 170, panCenter: 90,
  tiltMin: 10, tiltMax: 170, tiltCenter: 90,
  panInvert: false, tiltInvert: false,
  espInterval: 33,
  logMaxLines: 5,
  hideGraceMs: 800,
  // 🎮 Joystick
  joystickMaxSpeed: 90   // درجة/ثانية عند أقصى انحراف
};

const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d', {alpha: true});
const videoWrap = $('videoWrap'), wrap = $('wrap');
const hud = $('hud'), fpsEl = $('fps'), panel = $('panel');
const startBtn = $('startBtn'), resetBtn = $('resetBtn'), switchBtn = $('switchBtn');
const recordBtn = $('recordBtn'), selectBtn = $('selectBtn');
const hint = $('hint'), err = $('err');
const statusBar = $('statusBar'), recIndicator = $('recIndicator'), recTime = $('recTime');
const bottomBar = $('bottomBar'), logBox = $('logBox'), zoomBadge = $('zoomBadge');
const sensorBadge = $('sensorBadge');
const zoomInBtn = $('zoomInBtn'), zoomOutBtn = $('zoomOutBtn');
const joystickEl = $('joystick'), joystickKnob = $('joystickKnob');

function setStatus(msg, duration) {
  statusBar.textContent = msg;
  statusBar.style.display = 'block';
  clearTimeout(setStatus._t);
  setStatus._t = setTimeout(() => { statusBar.style.display = 'none'; }, duration || 2000);
}
function showError(m) { err.style.display = 'block'; err.textContent = m; }
function hideError() { err.style.display = 'none'; }
function addLog(text, isError) {
  if (!logBox) return;
  const line = document.createElement('div');
  line.className = 'logLine' + (isError ? ' err' : '');
  const t = new Date();
  const hh = String(t.getHours()).padStart(2, '0');
  const mm = String(t.getMinutes()).padStart(2, '0');
  const ss = String(t.getSeconds()).padStart(2, '0');
  line.textContent = `[${hh}:${mm}:${ss}] ${text}`;
  logBox.appendChild(line);
  while (logBox.children.length > CFG.logMaxLines) logBox.removeChild(logBox.firstChild);
}

let stream = null, running = false, facing = 'environment';
let lastFrame = 0, fpsN = 0, fpsT = performance.now(), fps = 0;
let rafId = 0, frameCount = 0;
let mode = 'idle';
let tracked = null;
let zoom = 1.0;
let recording = false, recorder = null, recChunks = [], recStartTime = 0, recTimer = 0;
let hideTimer = null;

const grayCanvas = document.createElement('canvas');
const grayCtx = grayCanvas.getContext('2d', {willReadFrequently: true});
let grayData = null, grayW = 480, grayH = 360;
const scratchRegion = new Uint8Array(CFG.patchSize * CFG.patchSize);

const recCanvas = document.createElement('canvas');
const recCtx = recCanvas.getContext('2d');

class PID {
  constructor(kp, ki, kd, integralLimit, outputLimit) {
    this.kp = kp; this.ki = ki; this.kd = kd;
    this.integral = 0; this.lastError = 0;
    this.integralLimit = integralLimit;
    this.outputLimit = outputLimit;
    this.terms = {p: 0, i: 0, d: 0};
  }
  update(error, dt) {
    if (dt <= 0) dt = 0.001;
    const p = this.kp * error;
    this.integral += error * dt;
    if (this.integral > this.integralLimit) this.integral = this.integralLimit;
    else if (this.integral < -this.integralLimit) this.integral = -this.integralLimit;
    const i = this.ki * this.integral;
    const d = this.kd * (error - this.lastError) / dt;
    let output = p + i + d;
    if (output > this.outputLimit) output = this.outputLimit;
    else if (output < -this.outputLimit) output = -this.outputLimit;
    this.lastError = error;
    this.terms = {p, i, d};
    return output;
  }
  reset() { this.integral = 0; this.lastError = 0; this.terms = {p:0,i:0,d:0}; }
}

const servoCtrl = {
  pan: CFG.panCenter,
  tilt: CFG.tiltCenter,
  panPID: new PID(CFG.panKp, CFG.panKi, CFG.panKd, CFG.pidIntegralLimit, CFG.maxStep),
  tiltPID: new PID(CFG.tiltKp, CFG.tiltKi, CFG.tiltKd, CFG.pidIntegralLimit, CFG.maxStep),
  lastT: 0, lastDPan: 0, lastDTilt: 0,
  update(errX, errY, now) {
    let dt = (now - this.lastT) / 1000;
    if (this.lastT === 0 || dt <= 0 || dt > 0.5) dt = 0.033;
    this.lastT = now;
    let ex = Math.abs(errX) < CFG.deadzone ? 0 : errX;
    let ey = Math.abs(errY) < CFG.deadzone ? 0 : errY;
    const dPanRaw  = this.panPID.update(ex, dt);
    const dTiltRaw = this.tiltPID.update(ey, dt);
    const dPan  = CFG.panInvert  ? -dPanRaw  : dPanRaw;
    const dTilt = CFG.tiltInvert ? -dTiltRaw : dTiltRaw;
    this.pan  -= dPan;
    this.tilt += dTilt;
    if (this.pan  < CFG.panMin)  this.pan  = CFG.panMin;
    if (this.pan  > CFG.panMax)  this.pan  = CFG.panMax;
    if (this.tilt < CFG.tiltMin) this.tilt = CFG.tiltMin;
    if (this.tilt > CFG.tiltMax) this.tilt = CFG.tiltMax;
    this.lastDPan = dPan;
    this.lastDTilt = dTilt;
  },
  reset() {
    this.pan = CFG.panCenter;
    this.tilt = CFG.tiltCenter;
    this.panPID.reset();
    this.tiltPID.reset();
    this.lastT = 0; this.lastDPan = 0; this.lastDTilt = 0;
  }
};

// ═══════════════════════════════════════════════
//  🎮 Joystick State
// ═══════════════════════════════════════════════
const joy = {
  active: false,
  pointerId: null,
  dx: 0, dy: 0,
  centerX: 0, centerY: 0,
  maxR: 55,
  lastT: 0,
  lastSentPan: -1, lastSentTilt: -1
};

function initJoystick() {
  if (!joystickEl) return;

  joystickEl.addEventListener('pointerdown', e => {
    if (!running) return;
    e.preventDefault();
    e.stopPropagation();
    if (joy.active) return;
    joy.active = true;
    joy.pointerId = e.pointerId;
    const r = joystickEl.getBoundingClientRect();
    joy.centerX = r.left + r.width / 2;
    joy.centerY = r.top + r.height / 2;
    joy.maxR = r.width / 2 - 28;
    joy.lastT = 0;
    joystickEl.classList.add('active');
    try { joystickEl.setPointerCapture(e.pointerId); } catch(err){}
    updateJoyVector(e.clientX, e.clientY);
    addLog('🎮 تحكم يدوي');
    setStatus('🎮 وضع التحكم اليدوي', 1200);
  });

  joystickEl.addEventListener('pointermove', e => {
    if (!joy.active || e.pointerId !== joy.pointerId) return;
    e.preventDefault();
    e.stopPropagation();
    updateJoyVector(e.clientX, e.clientY);
  });

  function endJoy(e) {
    if (!joy.active || e.pointerId !== joy.pointerId) return;
    e.preventDefault();
    e.stopPropagation();
    joy.active = false;
    joy.pointerId = null;
    joy.dx = 0; joy.dy = 0;
    joystickEl.classList.remove('active');
    joystickKnob.style.transform = 'translate(0,0)';
    try { joystickEl.releasePointerCapture(e.pointerId); } catch(err){}
    servoCtrl.panPID.reset();
    servoCtrl.tiltPID.reset();
    servoCtrl.lastT = 0;
    joy.lastSentPan = -1;
    joy.lastSentTilt = -1;
  }
  joystickEl.addEventListener('pointerup', endJoy);
  joystickEl.addEventListener('pointercancel', endJoy);
  joystickEl.addEventListener('pointerout', e => {
    if (joy.active && e.pointerId === joy.pointerId && e.buttons === 0) endJoy(e);
  });
}

function updateJoyVector(clientX, clientY) {
  let dx = clientX - joy.centerX;
  let dy = clientY - joy.centerY;
  const d = Math.hypot(dx, dy);
  if (d > joy.maxR) { dx = dx / d * joy.maxR; dy = dy / d * joy.maxR; }
  joy.dx = dx / joy.maxR;
  joy.dy = dy / joy.maxR;
  joystickKnob.style.transform = `translate(${dx}px,${dy}px)`;
}

// ═══════════════════════════════════════════════
//  🎮 تحديث السيرفو من Joystick
// ═══════════════════════════════════════════════
function updateManualServo(now) {
  let dt = (now - joy.lastT) / 1000;
  if (joy.lastT === 0 || dt <= 0 || dt > 0.5) dt = 0.033;
  joy.lastT = now;

  const spd = CFG.joystickMaxSpeed;
  const dPan  =  joy.dx * spd * dt;   // يمين = زيادة pan
  const dTilt =  joy.dy * spd * dt;   // أسفل = زيادة tilt

  servoCtrl.pan  = Math.max(CFG.panMin, Math.min(CFG.panMax, servoCtrl.pan  + dPan));
  servoCtrl.tilt = Math.max(CFG.tiltMin, Math.min(CFG.tiltMax, servoCtrl.tilt + dTilt));
  servoCtrl.lastDPan  = dPan;
  servoCtrl.lastDTilt = dTilt;

  espSender.sendManual();
  updateManualPanel();
}

function updateManualPanel() {
  const pan = servoCtrl.pan;
  const tilt = servoCtrl.tilt;
  const dxPct = Math.round(joy.dx * 100);
  const dyPct = Math.round(joy.dy * 100);
  const dPanColor  = Math.abs(joy.dx) < 0.05 ? '#888' : (joy.dx > 0 ? '#ff5252' : '#00e5ff');
  const dTiltColor = Math.abs(joy.dy) < 0.05 ? '#888' : (joy.dy > 0 ? '#ff5252' : '#00e5ff');

  panel.innerHTML =
    '<div class="title manual">🎮 تحكم يدوي</div>' +
    '<div class="row"><span class="k">Pan Δ</span><span class="v" style="color:'+dPanColor+'">' +
      (dxPct>=0?'+':'') + dxPct + '%</span></div>' +
    '<div class="row"><span class="k">Tilt Δ</span><span class="v" style="color:'+dTiltColor+'">' +
      (dyPct>=0?'+':'') + dyPct + '%</span></div>' +
    '<div class="sep"></div>' +
    '<div class="row"><span class="k">Pan°</span><span class="v">' + pan.toFixed(0) + '°</span></div>' +
    '<div class="row"><span class="k">Tilt°</span><span class="v">' + tilt.toFixed(0) + '°</span></div>' +
    '<div class="sep"></div>' +
    '<div class="row"><span class="k">ESP</span><span class="v" style="color:' +
      (espSender.ok?'#00ff88':'#ff5252')+'">' + (espSender.ok?'✅':'⏸') + '</span></div>';
}

// ═══════════════════════════════════════════════
//  المستشعرات
// ═══════════════════════════════════════════════
const sensors = { supported: false, rotAlpha: 0, rotBeta: 0, rotGamma: 0, lastUpdate: 0 };
function initSensors() {
  if (window.DeviceMotionEvent) {
    window.addEventListener('devicemotion', (e) => {
      const r = e.rotationRate;
      if (r) {
        sensors.rotAlpha = r.alpha || 0;
        sensors.rotBeta  = r.beta  || 0;
        sensors.rotGamma = r.gamma || 0;
      }
      sensors.lastUpdate = performance.now();
      sensors.supported = true;
    }, true);
  }
  sensorBadge.style.display = 'block';
  setTimeout(() => {
    sensorBadge.textContent = sensors.supported ? '📡 نشطة' : '📡 معطلة';
  }, 2000);
}

const espSender = {
  ip: localStorage.getItem('trackvid_esp_ip') || '',
  enabled: false, lastSend: 0, ok: false, fails: 0, timer: null,
  sentCount: 0, lastPan: -1, lastTilt: -1,
  setIP(v) {
    this.ip = (v || '').trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    if (this.ip) localStorage.setItem('trackvid_esp_ip', this.ip);
    else localStorage.removeItem('trackvid_esp_ip');
  },
  ping() {
    if (!this.ip) return;
    const self = this;
    const img = new Image();
    img.onload = img.onerror = () => {
      const wasOk = self.ok;
      self.ok = true; self.fails = 0;
      if (!wasOk) addLog('✅ ESP متصل: ' + self.ip);
      updateEspUI();
    };
    img.src = `http://${this.ip}/status?_=${Date.now()}`;
    setTimeout(() => { if (self.fails > 0) { self.ok = false; updateEspUI(); } }, 1000);
  },
  send() {
    if (!this.enabled || !this.ip) return;
    if (mode !== 'locked') return;
    if (joy.active) return;  // اليدوي له الأسبقية
    const now = performance.now();
    if (now - this.lastSend < CFG.espInterval) return;
    this.lastSend = now;
    const pan = servoCtrl.pan.toFixed(1);
    const tilt = servoCtrl.tilt.toFixed(1);
    if (pan === this.lastPan && tilt === this.lastTilt) return;
    this.lastPan = pan; this.lastTilt = tilt;
    this._fire(`http://${this.ip}/servo?pan=${pan}&tilt=${tilt}`);
    this.sentCount++;
    if (this.sentCount <= 3 || this.sentCount % 30 === 0) {
      addLog(`📡 pan=${pan}° tilt=${tilt}°`);
    }
  },
  sendManual() {
    if (!this.enabled || !this.ip) return;
    const now = performance.now();
    if (now - this.lastSend < CFG.espInterval) return;
    this.lastSend = now;
    const pan = servoCtrl.pan.toFixed(1);
    const tilt = servoCtrl.tilt.toFixed(1);
    if (pan === joy.lastSentPan && tilt === joy.lastSentTilt) return;
    joy.lastSentPan = pan;
    joy.lastSentTilt = tilt;
    this.lastPan = pan; this.lastTilt = tilt;
    this._fire(`http://${this.ip}/servo?pan=${pan}&tilt=${tilt}`);
  },
  stop() {
    if (!this.ip) return;
    this._fire(`http://${this.ip}/reset`);
  },
  _fire(url) {
    const self = this;
    const img = new Image();
    img.onload = img.onerror = () => {
      if (!self.ok) { self.ok = true; updateEspUI(); }
      self.fails = 0;
    };
    img.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
    clearTimeout(self.timer);
    self.timer = setTimeout(() => {
      self.fails++;
      if (self.fails >= 5 && self.ok) {
        self.ok = false;
        addLog('⚠ فُقد الاتصال بـ ESP', true);
        updateEspUI();
      }
    }, 400);
  }
};
function updateEspUI() {
  const dot = $('espDot'), btn = $('espBtn');
  if (!dot) return;
  dot.className = 'espDot ' + (espSender.enabled ? (espSender.ok ? 'on' : 'off') : '');
  if (espSender.enabled && !espSender.ok && espSender.fails < 5) dot.className = 'espDot mid';
  btn.classList.toggle('off', !espSender.enabled);
  btn.textContent = espSender.enabled ? 'قطع' : 'ربط';
}
$('espBtn').addEventListener('click', e => {
  e.stopPropagation();
  const ip = $('espIP');
  if (espSender.enabled) {
    espSender.enabled = false; espSender.ok = false;
    addLog('⏹ قطع الاتصال'); updateEspUI(); return;
  }
  const v = ip.value.trim();
  if (!v) { ip.focus(); return; }
  espSender.setIP(v);
  espSender.enabled = true; espSender.fails = 0; espSender.sentCount = 0;
  addLog('🔗 محاولة الاتصال بـ ' + v);
  espSender.ping(); updateEspUI();
});
$('espIP').addEventListener('keypress', e => { if (e.key === 'Enter') $('espBtn').click(); });
if (espSender.ip) $('espIP').value = espSender.ip;
updateEspUI();

function resize() {
  const r = wrap.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 350));
resize();

function fit() {
  const r = wrap.getBoundingClientRect();
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const scale = Math.max(r.width / vw, r.height / vh);
  return { scale, ox: (r.width - vw * scale) / 2, oy: (r.height - vh * scale) / 2, vw, vh, w: r.width, h: r.height };
}
function videoToLocal(vx, vy) {
  const f = fit();
  return [f.ox + vx * f.scale, f.oy + vy * f.scale];
}

function initGrayCanvas() {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  if (vw >= vh) { grayW = CFG.grayMaxDim; grayH = Math.round(CFG.grayMaxDim * vh / vw); }
  else { grayH = CFG.grayMaxDim; grayW = Math.round(CFG.grayMaxDim * vw / vh); }
  grayCanvas.width = grayW; grayCanvas.height = grayH;
  grayData = null;
}
function grabGray() {
  if (video.readyState < 2) return null;
  if (grayCanvas.width !== grayW || grayCanvas.height !== grayH) initGrayCanvas();
  grayCtx.drawImage(video, 0, 0, grayW, grayH);
  const img = grayCtx.getImageData(0, 0, grayW, grayH);
  if (!grayData || grayData.length !== img.data.length) grayData = new Uint8ClampedArray(img.data.length);
  grayData.set(img.data);
  return grayData;
}
function extractRegion(gray, cx, cy, regionSize, out) {
  const P = CFG.patchSize;
  const half = regionSize * 0.5;
  const step = regionSize / P;
  const x0 = cx - half, y0 = cy - half;
  const W = grayW, H = grayH;
  let k = 0;
  for (let py = 0; py < P; py++) {
    const sy = (y0 + py * step) | 0;
    if (sy < 0 || sy >= H) { k += P; continue; }
    const rowBase = sy * W * 4;
    for (let px = 0; px < P; px++) {
      const sx = (x0 + px * step) | 0;
      if (sx >= 0 && sx < W) {
        const idx = rowBase + sx * 4;
        out[k] = (gray[idx] * 77 + gray[idx + 1] * 150 + gray[idx + 2] * 29) >> 8;
      }
      k++;
    }
  }
  return out;
}
function sad(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d < 0 ? -d : d; }
  return s;
}

function getBoxScreenRect() {
  const W = canvas.width / (window.devicePixelRatio || 1);
  const H = canvas.height / (window.devicePixelRatio || 1);
  const size = Math.min(W, H) * CFG.boxScreenRatio / zoom;
  const cx = W / 2, cy = H / 2;
  return { x: cx - size/2, y: cy - size/2, w: size, h: size, cx, cy };
}

function lockObject() {
  const gray = grabGray();
  if (!gray) { addLog('⚠ الكاميرا غير جاهزة', true); return; }
  const gcx = grayW / 2, gcy = grayH / 2;
  const temp = new Uint8Array(CFG.patchSize * CFG.patchSize);
  extractRegion(gray, gcx, gcy, CFG.initRegion, temp);
  tracked = {
    template: temp.slice(),
    cx: gcx, cy: gcy,
    scale: CFG.initRegion / CFG.patchSize,
    initRegionSize: CFG.initRegion,
    lastSeen: performance.now(),
    velocity: [0, 0],
    sad: 0, live: true, lostCount: 0,
    lastGyroTime: performance.now()
  };
  mode = 'locked';
  servoCtrl.reset();
  panel.style.display = 'block';
  logBox.style.display = 'flex';
  hud.textContent = '🔴 الهدف مقفل';
  selectBtn.style.display = 'none';
  setStatus('🔴 تم التحديد — PID يبدأ', 2000);
  addLog('🔴 تحديد — PID يعمل');
}
function unlockObject() {
  tracked = null;
  mode = 'idle';
  panel.style.display = 'none';
  hud.textContent = 'Trackvid · جاهز';
  selectBtn.style.display = 'flex';
  servoCtrl.reset();
  addLog('✕ إلغاء التحديد');
  espSender.stop();
}

function trackStep(now) {
  if (!tracked) return;
  const gray = grabGray();
  if (!gray) return;
  const P = CFG.patchSize;
  const template = tracked.template;

  let sensorPredX = 0, sensorPredY = 0;
  const dtGyro = (now - tracked.lastGyroTime) / 1000;
  tracked.lastGyroTime = now;
  if (sensors.supported && dtGyro < 0.5) {
    sensorPredX = -sensors.rotGamma * CFG.gyroScale * dtGyro;
    sensorPredY = -sensors.rotBeta  * CFG.gyroScale * dtGyro;
    sensorPredX = Math.max(-30, Math.min(30, sensorPredX));
    sensorPredY = Math.max(-30, Math.min(30, sensorPredY));
  }

  const predictX = tracked.cx + tracked.velocity[0] + sensorPredX * CFG.sensorWeight;
  const predictY = tracked.cy + tracked.velocity[1] + sensorPredY * CFG.sensorWeight;
  const baseScale = tracked.scale;
  const regionBase = P * baseScale;

  let best = { sad: Infinity, x: predictX, y: predictY, scale: baseScale };
  const lost = tracked.lostCount > CFG.lostFramesToWarn;
  const R = lost ? CFG.searchRadiusLost : CFG.searchRadius;
  const step = lost ? CFG.coarseStepLost : CFG.coarseStep;

  for (let dy = -R; dy <= R; dy += step) {
    for (let dx = -R; dx <= R; dx += step) {
      extractRegion(gray, predictX + dx, predictY + dy, regionBase, scratchRegion);
      const s = sad(template, scratchRegion);
      if (s < best.sad) { best.sad = s; best.x = predictX + dx; best.y = predictY + dy; best.scale = baseScale; }
    }
  }
  const FR = CFG.fineRadius, cx0 = best.x, cy0 = best.y;
  for (let dy = -FR; dy <= FR; dy++) {
    for (let dx = -FR; dx <= FR; dx++) {
      if (dx === 0 && dy === 0) continue;
      extractRegion(gray, cx0 + dx, cy0 + dy, regionBase, scratchRegion);
      const s = sad(template, scratchRegion);
      if (s < best.sad) { best.sad = s; best.x = cx0 + dx; best.y = cy0 + dy; }
    }
  }
  for (let i = 0; i < CFG.scales.length; i++) {
    const sc = CFG.scales[i];
    if (Math.abs(sc - baseScale) < 0.04) continue;
    extractRegion(gray, best.x, best.y, P * sc, scratchRegion);
    const s = sad(template, scratchRegion);
    if (s < best.sad * 0.92) { best.sad = s; best.scale = sc; }
  }

  if (best.sad < CFG.minSAD) {
    const a = CFG.posSmoothing;
    const newX = tracked.cx * (1 - a) + best.x * a;
    const newY = tracked.cy * (1 - a) + best.y * a;
    const sA = CFG.sizeSmoothing;
    const newScale = tracked.scale * sA + best.scale * (1 - sA);
    tracked.velocity = [
      tracked.velocity[0] * 0.55 + (newX - tracked.cx) * 0.45,
      tracked.velocity[1] * 0.55 + (newY - tracked.cy) * 0.45
    ];
    tracked.cx = newX; tracked.cy = newY;
    tracked.scale = Math.max(CFG.minScale, Math.min(CFG.maxScale, newScale));
    tracked.lastSeen = now;
    tracked.sad = best.sad;
    tracked.live = true;
    tracked.lostCount = 0;
    if (best.sad < CFG.bestSAD && frameCount % CFG.templateUpdateEvery === 0) {
      const region = new Uint8Array(P * P);
      extractRegion(gray, tracked.cx, tracked.cy, P * tracked.scale, region);
      const tpl = tracked.template;
      for (let i = 0; i < tpl.length; i++) tpl[i] = (tpl[i] * 7 + region[i]) >> 3;
    }
  } else {
    tracked.lostCount++;
    tracked.cx += tracked.velocity[0] + sensorPredX * CFG.sensorWeight;
    tracked.cy += tracked.velocity[1] + sensorPredY * CFG.sensorWeight;
    tracked.velocity[0] *= 0.9;
    tracked.velocity[1] *= 0.9;
    if (tracked.lostCount >= CFG.lostFramesToWarn && tracked.live) {
      tracked.live = false;
      addLog('⚠ الهدف مفقود');
    }
  }
}

// ═══ Touch (Pinch zoom) ═══
const pointers = new Map();
let pinchStartDist = 0, pinchStartZoom = 1, isPinching = false;
function getTwoPointerDistance() {
  const pts = Array.from(pointers.values());
  if (pts.length < 2) return 0;
  return Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
}
function setZoom(z, fromPinch) {
  const nz = Math.max(CFG.zoomMin, Math.min(CFG.zoomMax, z));
  if (Math.abs(nz - zoom) < 0.001) return;
  zoom = nz;
  if (fromPinch) videoWrap.style.transition = 'none';
  else videoWrap.style.transition = 'transform .15s ease-out';
  videoWrap.style.transform = `scale(${zoom})`;
  zoomBadge.textContent = zoom.toFixed(2) + '×';
  zoomBadge.style.display = 'block';
  clearTimeout(setZoom._t);
  setZoom._t = setTimeout(() => { zoomBadge.style.display = 'none'; }, 1200);
}
canvas.addEventListener('pointerdown', e => {
  if (!running) return;
  try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pointers.size === 2) {
    isPinching = true;
    pinchStartDist = getTwoPointerDistance();
    pinchStartZoom = zoom;
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (isPinching && pointers.size === 2 && pinchStartDist > 0) {
    const d = getTwoPointerDistance();
    setZoom(pinchStartZoom * (d / pinchStartDist), true);
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
  if (pointers.size < 2) {
    if (isPinching) videoWrap.style.transition = 'transform .15s ease-out';
    isPinching = false;
    pinchStartDist = 0;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

zoomInBtn.addEventListener('click', e => { e.stopPropagation(); setZoom(zoom * 1.25, false); });
zoomOutBtn.addEventListener('click', e => { e.stopPropagation(); setZoom(zoom / 1.25, false); });
selectBtn.addEventListener('click', e => { e.stopPropagation(); lockObject(); });
resetBtn.addEventListener('click', e => { e.stopPropagation(); unlockObject(); });

// ═══ Recording ═══
function pickMime() {
  const types = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const t of types) if (MediaRecorder.isTypeSupported(t)) return t;
  return '';
}
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
}
function startRecording() {
  if (recording || !running) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  let CW = vw, CH = vh;
  if (Math.max(CW, CH) > CFG.recMaxDim) {
    const k = CFG.recMaxDim / Math.max(CW, CH);
    CW = Math.round(CW * k); CH = Math.round(CH * k);
  }
  recCanvas.width = CW; recCanvas.height = CH;
  const streamFromCanvas = recCanvas.captureStream(30);
  const mime = pickMime();
  try {
    recorder = new MediaRecorder(streamFromCanvas, mime ? { mimeType: mime, videoBitsPerSecond: 3000000 } : undefined);
  } catch (e) { showError('التسجيل غير مدعوم: ' + e.message); return; }
  recChunks = [];
  recorder.ondataavailable = ev => { if (ev.data && ev.data.size > 0) recChunks.push(ev.data); };
  recorder.onstop = () => {
    if (recChunks.length === 0) { addLog('⚠ لا توجد بيانات', true); return; }
    const blob = new Blob(recChunks, { type: mime || 'video/webm' });
    const ext = (mime && mime.includes('mp4')) ? 'mp4' : 'webm';
    const filename = `Trackvid_${Date.now()}.${ext}`;
    const mimeType = mime || 'video/webm';
    if (window.AndroidBridge && window.AndroidBridge.saveVideo) {
      addLog('💾 حفظ الفيديو…');
      const reader = new FileReader();
      reader.onloadend = () => {
        try {
          const base64 = reader.result.split(',')[1];
          const res = AndroidBridge.saveVideo(base64, filename, mimeType);
          if (res && res.startsWith('OK')) {
            addLog('✅ حُفظ في المعرض');
            setStatus('✅ حُفظ في معرض الصور', 2500);
          } else { addLog('❌ فشل: ' + res, true); }
        } catch (e) { addLog('❌ ' + e.message, true); }
      };
      reader.readAsDataURL(blob);
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    addLog('✅ حُفظ الفيديو');
  };
  recorder.start(1000);
  recording = true;
  recStartTime = performance.now();
  recordBtn.classList.add('on');
  recIndicator.style.display = 'flex';
  recTimer = setInterval(() => { recTime.textContent = fmtTime(performance.now() - recStartTime); }, 500);
  addLog('⏺ بدأ التسجيل');
}
function stopRecording() {
  if (!recording || !recorder) return;
  try { recorder.stop(); } catch (e) {}
  recording = false;
  recordBtn.classList.remove('on');
  recIndicator.style.display = 'none';
  clearInterval(recTimer);
  recorder = null;
  addLog('⏹ إيقاف التسجيل');
}
recordBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (recording) stopRecording(); else startRecording();
});

function drawForRecording() {
  if (!recording || !recCanvas.width) return;
  const CW = recCanvas.width, CH = recCanvas.height;
  const VW = video.videoWidth, VH = video.videoHeight;
  const Z = zoom;
  const srcW = VW / Z, srcH = VH / Z;
  const srcX = (VW - srcW) / 2, srcY = (VH - srcH) / 2;
  recCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, CW, CH);
  const boxSize = Math.min(CW, CH) * CFG.boxScreenRatio;
  const bx = CW/2 - boxSize/2, by = CH/2 - boxSize/2;
  recCtx.strokeStyle = mode === 'locked' ? '#ff3c3c' : '#00ff88';
  recCtx.lineWidth = Math.max(2, Math.min(CW, CH) * 0.005);
  recCtx.shadowColor = recCtx.strokeStyle;
  recCtx.shadowBlur = 8;
  recCtx.strokeRect(bx, by, boxSize, boxSize);
  recCtx.shadowBlur = 0;
  const ccx = CW/2, ccy = CH/2;
  const cs = boxSize * 0.14;
  recCtx.beginPath();
  recCtx.moveTo(ccx-cs, ccy); recCtx.lineTo(ccx-cs*0.3, ccy);
  recCtx.moveTo(ccx+cs*0.3, ccy); recCtx.lineTo(ccx+cs, ccy);
  recCtx.moveTo(ccx, ccy-cs); recCtx.lineTo(ccx, ccy-cs*0.3);
  recCtx.moveTo(ccx, ccy+cs*0.3); recCtx.lineTo(ccx, ccy+cs);
  recCtx.stroke();
  if (mode === 'locked' && tracked) {
    const vScaleX = VW / grayW, vScaleY = VH / grayH;
    const ovx = tracked.cx * vScaleX, ovy = tracked.cy * vScaleY;
    const kx = CW / srcW, ky = CH / srcH;
    const tx = (ovx - srcX) * kx, ty = (ovy - srcY) * ky;
    recCtx.beginPath();
    recCtx.arc(tx, ty, 8, 0, Math.PI*2);
    recCtx.stroke();
  }
}

// ═══ Drawing ═══
function drawFixedBox() {
  const rect = getBoxScreenRect();
  const isLocked = mode === 'locked';
  const color = isLocked ? '#ff3c3c' : '#00ff88';
  ctx.save();
  ctx.strokeStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = isLocked ? 14 : 10;
  ctx.lineWidth = 3;
  ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
  const cl = Math.min(rect.w, rect.h) * 0.18;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(rect.x, rect.y+cl); ctx.lineTo(rect.x, rect.y); ctx.lineTo(rect.x+cl, rect.y);
  ctx.moveTo(rect.x+rect.w-cl, rect.y); ctx.lineTo(rect.x+rect.w, rect.y); ctx.lineTo(rect.x+rect.w, rect.y+cl);
  ctx.moveTo(rect.x+rect.w, rect.y+rect.h-cl); ctx.lineTo(rect.x+rect.w, rect.y+rect.h); ctx.lineTo(rect.x+rect.w-cl, rect.y+rect.h);
  ctx.moveTo(rect.x+cl, rect.y+rect.h); ctx.lineTo(rect.x, rect.y+rect.h); ctx.lineTo(rect.x, rect.y+rect.h-cl);
  ctx.stroke();
  ctx.lineWidth = 2.5;
  const cs = Math.min(rect.w, rect.h) * 0.18;
  const cx = rect.cx, cy = rect.cy;
  ctx.beginPath();
  ctx.moveTo(cx-cs, cy); ctx.lineTo(cx-cs*0.28, cy);
  ctx.moveTo(cx+cs*0.28, cy); ctx.lineTo(cx+cs, cy);
  ctx.moveTo(cx, cy-cs); ctx.lineTo(cx, cy-cs*0.28);
  ctx.moveTo(cx, cy+cs*0.28); ctx.lineTo(cx, cy+cs);
  ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, cs*0.32, 0, Math.PI*2);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, 2.2, 0, Math.PI*2);
  ctx.fill();
  ctx.lineWidth = 3;
  const r2 = cs + 5, arcLen = Math.PI/4;
  for (let k = 0; k < 4; k++) {
    const ang = k*Math.PI/2 + Math.PI/4 - arcLen/2;
    ctx.beginPath();
    ctx.arc(cx, cy, r2, ang, ang+arcLen);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTrackedMarker() {
  if (mode !== 'locked' || !tracked) return;
  const vScaleX = (video.videoWidth || 640) / grayW;
  const vScaleY = (video.videoHeight || 480) / grayH;
  const vx = tracked.cx * vScaleX, vy = tracked.cy * vScaleY;
  const [sx, sy] = videoToLocal(vx, vy);
  const live = tracked.live;
  ctx.save();
  ctx.strokeStyle = live ? '#ffeb3b' : 'rgba(255,235,59,0.5)';
  ctx.fillStyle = ctx.strokeStyle;
  ctx.shadowColor = '#ffeb3b';
  ctx.shadowBlur = live ? 8 : 3;
  ctx.lineWidth = 2;
  const s = 22 / zoom;
  ctx.strokeRect(sx - s/2, sy - s/2, s, s);
  ctx.beginPath();
  ctx.arc(sx, sy, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function updatePanel(now) {
  if (!tracked) return;
  const vScaleX = (video.videoWidth || 640) / grayW;
  const vScaleY = (video.videoHeight || 480) / grayH;
  const offX = (tracked.cx - grayW/2) * vScaleX;
  const offY = (tracked.cy - grayH/2) * vScaleY;
  servoCtrl.update(offX, offY, now);
  const dPanSend  = -servoCtrl.lastDPan;
  const dTiltSend =  servoCtrl.lastDTilt;
  const panSign  = dPanSend  > 0.005 ? '+' : '';
  const tiltSign = dTiltSend > 0.005 ? '+' : '';
  const panColor  = Math.abs(dPanSend)  < 0.005 ? '#888' : (dPanSend  > 0 ? '#ff5252' : '#00e5ff');
  const tiltColor = Math.abs(dTiltSend) < 0.005 ? '#888' : (dTiltSend > 0 ? '#ff5252' : '#00e5ff');
  panel.innerHTML =
    '<div class="title">🎯 PID السيرفو</div>' +
    '<div class="row"><span class="k">Pan Δ</span><span class="v" style="color:'+panColor+'">'+
      panSign + dPanSend.toFixed(2) + '°</span></div>' +
    '<div class="row"><span class="k">Tilt Δ</span><span class="v" style="color:'+tiltColor+'">'+
      tiltSign + dTiltSend.toFixed(2) + '°</span></div>' +
    '<div class="sep"></div>' +
    '<div class="row"><span class="k">Pan°</span><span class="v">'+servoCtrl.pan.toFixed(0)+'°</span></div>' +
    '<div class="row"><span class="k">Tilt°</span><span class="v">'+servoCtrl.tilt.toFixed(0)+'°</span></div>' +
    '<div class="sep"></div>' +
    '<div class="row"><span class="k">ESP</span><span class="v" style="color:'+(espSender.ok?'#00ff88':'#ff5252')+'">'+
      (espSender.ok?'✅':'⏸')+'</span></div>';
  espSender.send();
}

function render(now) {
  const r = wrap.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  drawFixedBox();
  if (mode === 'locked' && tracked) drawTrackedMarker();

  // 🎮 أولوية التحكم اليدوي
  if (joy.active) {
    updateManualServo(now);
  } else if (mode === 'locked') {
    updatePanel(now);
  }
}

function loop() {
  if (!running) return;
  const now = performance.now();
  fpsN++;
  if (now - fpsT >= 1000) {
    fps = fpsN * 1000 / (now - fpsT);
    fpsEl.textContent = fps.toFixed(0) + ' fps';
    fpsN = 0; fpsT = now;
  }
  if (video.readyState >= 2 && now - lastFrame > CFG.frameIntervalMs) {
    lastFrame = now;
    frameCount++;
    if (mode === 'locked' && tracked && !joy.active) trackStep(now);
    render(now);
    if (recording) drawForRecording();
  }
  rafId = requestAnimationFrame(loop);
}

async function start() {
  startBtn.disabled = true;
  startBtn.textContent = 'جارٍ التشغيل…';
  hideError();
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('الكاميرا تحتاج HTTPS.');
    }
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1280 }, height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 }
      }
    });
    video.srcObject = stream;
    await new Promise((res, rej) => {
      if (video.readyState >= 1) { res(); return; }
      video.onloadedmetadata = res;
      setTimeout(() => rej(new Error('انتهت مهلة الكاميرا')), 10000);
    });
    await video.play();
    initGrayCanvas();
    resize();
    initSensors();
    initJoystick();
    running = true;
    startBtn.style.display = 'none';
    bottomBar.style.display = 'flex';
    $('espBar').style.display = 'flex';
    logBox.style.display = 'flex';
    selectBtn.style.display = 'flex';
    joystickEl.style.display = 'block';
    hud.textContent = 'Trackvid · جاهز';
    hint.style.display = 'block';
    setTimeout(() => { if (mode === 'idle') hint.style.display = 'none'; }, 1000);
    addLog('▶ تشغيل');
    addLog('🎮 عصا التحكم جاهزة');
    loop();
  } catch (e) {
    showError('تعذر التشغيل: ' + (e.message || e));
    hud.textContent = 'تعذر التشغيل';
    startBtn.disabled = false;
    startBtn.textContent = '↻ إعادة المحاولة';
  }
}
async function switchCamera() {
  if (!running) return;
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) stream.getTracks().forEach(t => t.stop());
  running = false;
  cancelAnimationFrame(rafId);
  unlockObject();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1280 }, height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 }
      }
    });
    video.srcObject = stream;
    await video.play();
    initGrayCanvas();
    running = true;
    frameCount = 0;
    addLog('🔄 تبديل الكاميرا');
    loop();
  } catch (e) {
    showError('تعذر تبديل الكاميرا: ' + e.message);
    running = false;
  }
}
startBtn.addEventListener('click', start);
switchBtn.addEventListener('click', e => { e.stopPropagation(); switchCamera(); });

function stopAll() {
  if (running) {
    running = false;
    cancelAnimationFrame(rafId);
    rafId = 0;
  }
  if (recording) { try { stopRecording(); } catch(e) {} }
  if (stream) {
    try { stream.getTracks().forEach(t => { try { t.stop(); } catch(e) {} }); } catch(e) {}
    stream = null;
  }
  if (video) {
    try { video.pause(); } catch(e) {}
    try { video.srcObject = null; } catch(e) {}
    try { video.load(); } catch(e) {}
  }
  if (espSender.enabled && espSender.ip) {
    try {
      const img = new Image();
      img.src = `http://${espSender.ip}/reset?_=${Date.now()}`;
    } catch(e) {}
  }
  if (startBtn) {
    startBtn.disabled = false;
    startBtn.textContent = '▶ تشغيل الكاميرا';
    startBtn.style.display = 'block';
  }
  if (bottomBar) bottomBar.style.display = 'none';
  if ($('espBar')) $('espBar').style.display = 'none';
  if (logBox) logBox.style.display = 'none';
  if (panel) panel.style.display = 'none';
  if (joystickEl) joystickEl.style.display = 'none';
  tracked = null;
  mode = 'idle';
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (document.hidden && running) { addLog('⏸ إيقاف'); stopAll(); }
    }, CFG.hideGraceMs);
  } else {
    clearTimeout(hideTimer);
  }
});
window.addEventListener('pagehide', () => stopAll());
window.addEventListener('beforeunload', () => stopAll());
window.addEventListener('unload', () => stopAll());
})();
</script>
