<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>MokTrak Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#wrap{width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#wrap{position:relative;overflow:hidden}
#videoWrap{position:absolute;inset:0;transform-origin:center center;transition:transform .15s ease-out}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud,#fps{position:absolute;z-index:5;color:#00ff88;background:#0009;border:1px solid #00ff8844;border-radius:14px;font:600 11px monospace;padding:6px 9px;text-shadow:0 1px 3px #000}
#hud{top:10px;right:10px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fps{top:10px;left:10px}
#hint{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:#000c;border:1px solid #00ff88;color:#00ff88;padding:12px 20px;border-radius:20px;text-align:center;font-size:13px;max-width:85%;line-height:1.6}
#panel{position:absolute;z-index:5;right:8px;top:50%;transform:translateY(-50%);display:none;pointer-events:none;min-width:130px;max-width:158px;background:#0009;backdrop-filter:blur(4px);border:1px solid #00ff8855;border-radius:11px;padding:8px;color:#fff;font:11px ui-monospace,monospace;line-height:1.5;text-shadow:0 1px 3px #000}
#panel .title{font-weight:800;color:#00ff88;border-bottom:1px solid #00ff8844;padding-bottom:4px;margin-bottom:4px;font-size:12px}
.row{display:flex;justify-content:space-between;gap:8px}
.k{color:#00ff8899}.v{color:#fff;font-weight:700}
.good{color:#00ff88}.warn{color:#ffca28}.bad{color:#ff5252}
button{font-family:system-ui,sans-serif;font-weight:700;cursor:pointer;border:0}
#startBtn{position:absolute;z-index:8;bottom:28px;left:50%;transform:translateX(-50%);border-radius:28px;background:#00ff88;color:#00180d;padding:15px 26px;font-size:16px;box-shadow:0 5px 24px #00ff8844;white-space:nowrap}
#startBtn:disabled{opacity:.7}
/* أزرار سفلية */
#bottomBar{position:absolute;z-index:7;bottom:14px;right:10px;display:none;gap:8px;flex-direction:row}
.ctrlBtn{width:52px;height:52px;border-radius:26px;background:#001a10dd;border:1.5px solid #00ff8866;color:#00ff88;font-size:20px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:all .15s}
.ctrlBtn:active{transform:scale(.92)}
.ctrlBtn.rec{background:#ff1744;border-color:#ff1744;color:#fff}
.ctrlBtn.rec.on{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff174488}50%{box-shadow:0 0 0 12px #ff174400}}
/* أزرار التكبير */
#zoomBar{position:absolute;z-index:7;right:10px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:6px;align-items:center}
.zoomBtn{width:44px;height:44px;border-radius:22px;background:#001a10dd;border:1.5px solid #00ff8866;color:#00ff88;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.zoomBtn:active{transform:scale(.9)}
#zoomLevel{background:#000a;border:1px solid #00ff8855;border-radius:12px;color:#00ff88;font:700 11px monospace;padding:5px 8px;min-width:44px;text-align:center}
/* شريط ESP */
#espBar{position:absolute;z-index:7;top:80px;right:10px;display:none;gap:6px;align-items:center;background:#0009;border:1px solid #00ff8844;border-radius:14px;padding:6px 9px;font:600 10px monospace;backdrop-filter:blur(4px)}
#espBar input{background:#001a10;border:1px solid #00ff8855;border-radius:8px;color:#00ff88;padding:4px 7px;font:600 10px monospace;width:96px;outline:none}
#espBar input:focus{border-color:#00ff88}
#espBtn{background:#00ff88;color:#00180d;border-radius:8px;padding:5px 10px;font:700 10px system-ui}
#espBtn.off{background:#444;color:#aaa}
#espDot{width:8px;height:8px;border-radius:50%;background:#666;flex-shrink:0}
#espDot.on{background:#00ff88;box-shadow:0 0 8px #00ff88}
#espDot.off{background:#ff5252}
#espDot.mid{background:#ffca28}
/* شريط الحالة */
#statusBar{position:absolute;z-index:6;top:42px;left:50%;transform:translateX(-50%);background:#000a;color:#00ff88;font:600 10px monospace;padding:5px 12px;border-radius:10px;border:1px solid #00ff8833;display:none;max-width:90%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* رسالة الخطأ */
#err{display:none;position:absolute;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:440px;background:#180000f2;border:1px solid #ff5252;border-radius:12px;padding:16px;color:#ff7777;font-size:13px;line-height:1.6;white-space:pre-wrap}
/* مؤشر التسجيل */
#recIndicator{position:absolute;z-index:9;top:10px;left:50%;transform:translateX(-50%);background:#ff1744;color:#fff;font:700 11px monospace;padding:6px 12px;border-radius:14px;display:none;align-items:center;gap:6px}
#recIndicator::before{content:'';width:8px;height:8px;border-radius:4px;background:#fff;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="wrap">
  <div id="videoWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="hud">MokTrak · جاهز</div>
  <div id="fps">-- fps</div>
  <div id="statusBar"></div>
  <div id="recIndicator">● تسجيل <span id="recTime">00:00</span></div>
  <div id="hint">👆 انقر مرتين على أي كائن لتتبعه</div>
  <div id="panel"></div>

  <!-- أزرار التكبير -->
  <div id="zoomBar">
    <button class="zoomBtn" id="zoomIn">+</button>
    <div id="zoomLevel">1.0×</div>
    <button class="zoomBtn" id="zoomOut">−</button>
  </div>

  <!-- شريط ESP -->
  <div id="espBar">
    <span id="espDot"></span>
    <input id="espIP" type="text" placeholder="192.168.1.50" inputmode="numeric">
    <button id="espBtn" class="off">ربط</button>
  </div>

  <!-- أزرار سفلية -->
  <div id="bottomBar">
    <button class="ctrlBtn" id="resetBtn" title="إلغاء">✕</button>
    <button class="ctrlBtn rec" id="recordBtn" title="تسجيل">●</button>
    <button class="ctrlBtn" id="switchBtn" title="تبديل">⟳</button>
  </div>

  <button id="startBtn">▶ تشغيل الكاميرا</button>
  <div id="err"></div>
</div>

<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════
//  الإعدادات
// ═══════════════════════════════════════════════
const CFG = {
  // التتبع
  patchSize: 22,
  initRegion: 30,
  searchRadius: 22,
  coarseStep: 3,
  fineRadius: 3,
  scales: [0.6, 0.75, 0.9, 1.0, 1.15, 1.35, 1.6, 1.9],
  minScale: 0.5,
  maxScale: 2.2,
  minSAD: 3200,
  bestSAD: 900,
  posSmoothing: 0.55,
  sizeSmoothing: 0.85,
  grayMaxDim: 480,
  frameIntervalMs: 25,
  templateUpdateEvery: 8,
  lostFramesToWarn: 20,
  lostFramesToUnlock: 90,
  // النقر
  doubleTapMs: 350,
  doubleTapRadiusPx: 90,
  tapMoveThreshold: 22,
  tapMaxDuration: 400,
  // ESP
  espInterval: 100,
  // التكبير
  zoomMin: 1.0,
  zoomMax: 4.0,
  zoomStep: 0.25,
  // التسجيل
  recMaxDim: 720
};

// ═══════════════════════════════════════════════
//  DOM
// ═══════════════════════════════════════════════
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d', {alpha: true});
const videoWrap = $('videoWrap'), wrap = $('wrap');
const hud = $('hud'), fpsEl = $('fps'), panel = $('panel');
const startBtn = $('startBtn'), resetBtn = $('resetBtn'), switchBtn = $('switchBtn');
const recordBtn = $('recordBtn'), hint = $('hint'), err = $('err');
const statusBar = $('statusBar'), recIndicator = $('recIndicator'), recTime = $('recTime');
const zoomInBtn = $('zoomIn'), zoomOutBtn = $('zoomOut'), zoomLevel = $('zoomLevel');
const zoomBar = $('zoomBar'), bottomBar = $('bottomBar');

function setStatus(msg, duration) {
  statusBar.textContent = msg;
  statusBar.style.display = 'block';
  clearTimeout(setStatus._t);
  setStatus._t = setTimeout(() => { statusBar.style.display = 'none'; }, duration || 2000);
}
function showError(m) { err.style.display = 'block'; err.textContent = m; }
function hideError() { err.style.display = 'none'; }

// ═══════════════════════════════════════════════
//  الحالة
// ═══════════════════════════════════════════════
let stream = null, running = false, facing = 'environment';
let lastFrame = 0, fpsN = 0, fpsT = performance.now(), fps = 0;
let rafId = 0, frameCount = 0;

let tracked = null;
// {template, cx, cy, scale, initRegionSize, lastSeen, velocity, sad, live, lostCount}

let lastTap = null;
let pointerStart = null;
let zoom = 1.0;
let recording = false, recorder = null, recStream = null, recChunks = [], recStartTime = 0, recTimer = 0;

const grayCanvas = document.createElement('canvas');
const grayCtx = grayCanvas.getContext('2d', {willReadFrequently: true});
let grayData = null, grayW = 480, grayH = 360;
const scratchRegion = new Uint8Array(CFG.patchSize * CFG.patchSize);

// Canvas التسجيل
const recCanvas = document.createElement('canvas');
const recCtx = recCanvas.getContext('2d');

// ═══════════════════════════════════════════════
//  ESP8266
// ═══════════════════════════════════════════════
const espSender = {
  ip: localStorage.getItem('moktrak_esp_ip') || '',
  enabled: false, lastSend: 0, ok: false, fails: 0, timer: null,
  setIP(v) {
    this.ip = (v || '').trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    if (this.ip) localStorage.setItem('moktrak_esp_ip', this.ip);
    else localStorage.removeItem('moktrak_esp_ip');
  },
  ping() {
    if (!this.ip) return;
    const self = this;
    const img = new Image();
    img.onload = img.onerror = () => { self.ok = true; self.fails = 0; updateEspUI(); };
    img.src = `http://${this.ip}/status?_=${Date.now()}`;
    setTimeout(() => { if (self.fails > 0) { self.ok = false; updateEspUI(); } }, 1000);
  },
  send() {
    if (!this.enabled || !this.ip) return;
    const now = performance.now();
    if (now - this.lastSend < CFG.espInterval) return;
    this.lastSend = now;
    if (!tracked || !tracked.live) { this._fire(`http://${this.ip}/t?live=0`); return; }
    const vScaleX = (video.videoWidth || 640) / grayW;
    const vScaleY = (video.videoHeight || 480) / grayH;
    const vcx = tracked.cx * vScaleX;
    const vcy = tracked.cy * vScaleY;
    const vw = CFG.patchSize * tracked.scale * vScaleX;
    const vh = CFG.patchSize * tracked.scale * vScaleY;
    const x = Math.round(vcx - (video.videoWidth / 2));
    const y = Math.round(vcy - (video.videoHeight / 2));
    const w = Math.round(vw), h = Math.round(vh);
    const vx = Math.round(tracked.velocity[0] * vScaleX);
    const vy = Math.round(tracked.velocity[1] * vScaleY);
    const sp = Math.round(Math.hypot(vx, vy));
    this._fire(`http://${this.ip}/t?x=${x}&y=${y}&w=${w}&h=${h}&vx=${vx}&vy=${vy}&s=${sp}&live=1`);
  },
  stop() {
    if (!this.ip) return;
    const img = new Image();
    img.src = `http://${this.ip}/t?live=0&_=${Date.now()}`;
  },
  _fire(url) {
    const self = this;
    const img = new Image();
    img.onload = img.onerror = () => { self.ok = true; self.fails = 0; updateEspUI(); };
    img.src = url + '&_=' + Date.now();
    clearTimeout(self.timer);
    self.timer = setTimeout(() => {
      self.fails++;
      if (self.fails >= 3) { self.ok = false; updateEspUI(); }
    }, 400);
  }
};

function updateEspUI() {
  const dot = $('espDot'), btn = $('espBtn');
  if (!dot) return;
  dot.className = 'espDot ' + (espSender.enabled ? (espSender.ok ? 'on' : 'off') : '');
  if (espSender.enabled && !espSender.ok && espSender.fails < 3) dot.className = 'espDot mid';
  btn.classList.toggle('off', !espSender.enabled);
  btn.textContent = espSender.enabled ? 'قطع' : 'ربط';
}

$('espBtn').addEventListener('click', e => {
  e.stopPropagation();
  const ip = $('espIP');
  if (espSender.enabled) { espSender.enabled = false; espSender.ok = false; updateEspUI(); return; }
  const v = ip.value.trim();
  if (!v) { ip.focus(); return; }
  espSender.setIP(v);
  espSender.enabled = true; espSender.fails = 0;
  espSender.ping(); updateEspUI();
});
$('espIP').addEventListener('keypress', e => { if (e.key === 'Enter') $('espBtn').click(); });
if (espSender.ip) $('espIP').value = espSender.ip;
updateEspUI();

// ═══════════════════════════════════════════════
//  الأدوات
// ═══════════════════════════════════════════════
function resize() {
  const r = wrap.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 350));
resize();

function fit() {
  const r = wrap.getBoundingClientRect();
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const scale = Math.max(r.width / vw, r.height / vh);
  return {
    scale,
    ox: (r.width - vw * scale) / 2,
    oy: (r.height - vh * scale) / 2,
    vw, vh, w: r.width, h: r.height
  };
}

// شاشة → إحداثيات محلية (قبل التحويل zoom)
function screenToLocal(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const w = r.width, h = r.height;
  const lx = w/2 + (clientX - r.left - w/2) / zoom;
  const ly = h/2 + (clientY - r.top  - h/2) / zoom;
  return [lx, ly];
}

// محلية → إحداثيات الفيديو
function localToVideo(lx, ly) {
  const f = fit();
  return [(lx - f.ox) / f.scale, (ly - f.oy) / f.scale];
}

function videoToGray(x, y) {
  return [x * grayW / (video.videoWidth || 640), y * grayH / (video.videoHeight || 480)];
}
function grayToVideo(x, y) {
  return [x * (video.videoWidth || 640) / grayW, y * (video.videoHeight || 480) / grayH];
}

// ═══════════════════════════════════════════════
//  الصورة الرمادية
// ═══════════════════════════════════════════════
function initGrayCanvas() {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const maxDim = CFG.grayMaxDim;
  if (vw >= vh) { grayW = maxDim; grayH = Math.round(maxDim * vh / vw); }
  else { grayH = maxDim; grayW = Math.round(maxDim * vw / vh); }
  grayCanvas.width = grayW; grayCanvas.height = grayH;
  grayData = null;
}
function grabGray() {
  if (video.readyState < 2) return null;
  if (grayCanvas.width !== grayW || grayCanvas.height !== grayH) initGrayCanvas();
  grayCtx.drawImage(video, 0, 0, grayW, grayH);
  const img = grayCtx.getImageData(0, 0, grayW, grayH);
  if (!grayData || grayData.length !== img.data.length) grayData = new Uint8ClampedArray(img.data.length);
  grayData.set(img.data);
  return grayData;
}

// ═══════════════════════════════════════════════
//  استخراج رقعة + SAD
// ═══════════════════════════════════════════════
function extractRegion(gray, cx, cy, regionSize, out) {
  const P = CFG.patchSize;
  const half = regionSize * 0.5;
  const step = regionSize / P;
  const x0 = cx - half, y0 = cy - half;
  const W = grayW, H = grayH;
  let k = 0;
  for (let py = 0; py < P; py++) {
    const sy = (y0 + py * step) | 0;
    if (sy < 0 || sy >= H) { k += P; continue; }
    const rowBase = sy * W * 4;
    for (let px = 0; px < P; px++) {
      const sx = (x0 + px * step) | 0;
      if (sx >= 0 && sx < W) {
        const idx = rowBase + sx * 4;
        out[k] = (gray[idx] * 77 + gray[idx + 1] * 150 + gray[idx + 2] * 29) >> 8;
      }
      k++;
    }
  }
  return out;
}
function sad(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d < 0 ? -d : d; }
  return s;
}

// ═══════════════════════════════════════════════
//  قفل / إلغاء
// ═══════════════════════════════════════════════
function lockAt(clientX, clientY) {
  const [lx, ly] = screenToLocal(clientX, clientY);
  const [vx, vy] = localToVideo(lx, ly);
  const [gx, gy] = videoToGray(vx, vy);
  const gray = grabGray();
  if (!gray) return;

  const temp = new Uint8Array(CFG.patchSize * CFG.patchSize);
  extractRegion(gray, gx, gy, CFG.initRegion, temp);

  tracked = {
    template: temp.slice(),
    cx: gx, cy: gy,
    scale: CFG.initRegion / CFG.patchSize,
    initRegionSize: CFG.initRegion,
    lastSeen: performance.now(),
    velocity: [0, 0],
    sad: 0,
    live: true,
    lostCount: 0
  };

  hint.style.display = 'none';
  resetBtn.style.display = 'flex';
  panel.style.display = 'block';
  hud.textContent = '🎯 مقفل';
  setStatus('✅ تم القفل — التتبع نشط', 2000);
}

function unlock() {
  if (!tracked) return;
  tracked = null;
  resetBtn.style.display = 'none';
  panel.style.display = 'none';
  hud.textContent = 'MokTrak · جاهز';
  setStatus('إلغاء القفل', 1200);
  espSender.stop();
}

// ═══════════════════════════════════════════════
//  التتبع
// ═══════════════════════════════════════════════
function trackStep(now) {
  if (!tracked) return;
  const gray = grabGray();
  if (!gray) return;

  const P = CFG.patchSize;
  const template = tracked.template;
  const baseX = tracked.cx, baseY = tracked.cy, baseScale = tracked.scale;
  const regionBase = P * baseScale;

  let best = { sad: Infinity, x: baseX, y: baseY, scale: baseScale };

  // 1) بحث خشن
  const R = CFG.searchRadius, step = CFG.coarseStep;
  for (let dy = -R; dy <= R; dy += step) {
    for (let dx = -R; dx <= R; dx += step) {
      extractRegion(gray, baseX + dx, baseY + dy, regionBase, scratchRegion);
      const s = sad(template, scratchRegion);
      if (s < best.sad) { best.sad = s; best.x = baseX + dx; best.y = baseY + dy; best.scale = baseScale; }
    }
  }
  // 2) بحث دقيق
  const FR = CFG.fineRadius;
  const cx0 = best.x, cy0 = best.y;
  for (let dy = -FR; dy <= FR; dy++) {
    for (let dx = -FR; dx <= FR; dx++) {
      if (dx === 0 && dy === 0) continue;
      extractRegion(gray, cx0 + dx, cy0 + dy, regionBase, scratchRegion);
      const s = sad(template, scratchRegion);
      if (s < best.sad) { best.sad = s; best.x = cx0 + dx; best.y = cy0 + dy; }
    }
  }
  // 3) بحث بالمقاييس
  for (let i = 0; i < CFG.scales.length; i++) {
    const sc = CFG.scales[i];
    if (Math.abs(sc - baseScale) < 0.04) continue;
    const regionSize = P * sc;
    extractRegion(gray, best.x, best.y, regionSize, scratchRegion);
    const s = sad(template, scratchRegion);
    if (s < best.sad * 0.92) { best.sad = s; best.scale = sc; }
  }

  // 4) القرار
  if (best.sad < CFG.minSAD) {
    const alpha = CFG.posSmoothing;
    const newX = tracked.cx * (1 - alpha) + best.x * alpha;
    const newY = tracked.cy * (1 - alpha) + best.y * alpha;
    const sAlpha = CFG.sizeSmoothing;
    const newScale = tracked.scale * sAlpha + best.scale * (1 - sAlpha);

    tracked.velocity = [
      tracked.velocity[0] * 0.55 + (newX - tracked.cx) * 0.45,
      tracked.velocity[1] * 0.55 + (newY - tracked.cy) * 0.45
    ];
    tracked.cx = newX; tracked.cy = newY;
    tracked.scale = Math.max(CFG.minScale, Math.min(CFG.maxScale, newScale));
    tracked.lastSeen = now;
    tracked.sad = best.sad;
    tracked.live = true;
    tracked.lostCount = 0;

    if (best.sad < CFG.bestSAD && frameCount % CFG.templateUpdateEvery === 0) {
      const region = new Uint8Array(P * P);
      extractRegion(gray, tracked.cx, tracked.cy, P * tracked.scale, region);
      const tpl = tracked.template;
      for (let i = 0; i < tpl.length; i++) tpl[i] = (tpl[i] * 7 + region[i]) >> 3;
    }
  } else {
    tracked.lostCount++;
    tracked.cx += tracked.velocity[0];
    tracked.cy += tracked.velocity[1];
    tracked.velocity[0] *= 0.9;
    tracked.velocity[1] *= 0.9;
    if (tracked.lostCount >= CFG.lostFramesToWarn) tracked.live = false;
    if (tracked.lostCount >= CFG.lostFramesToUnlock) unlock();
  }
}

// ═══════════════════════════════════════════════
//  النقر المزدوج
// ═══════════════════════════════════════════════
canvas.addEventListener('pointerdown', e => {
  if (!running) return;
  pointerStart = { x: e.clientX, y: e.clientY, t: performance.now() };
});

canvas.addEventListener('pointerup', e => {
  if (!running || !pointerStart) return;
  const dx = e.clientX - pointerStart.x;
  const dy = e.clientY - pointerStart.y;
  const moved = Math.hypot(dx, dy);
  const dt = performance.now() - pointerStart.t;
  pointerStart = null;
  if (moved > CFG.tapMoveThreshold || dt > CFG.tapMaxDuration) return;

  const now = performance.now();
  if (lastTap && (now - lastTap.time) < CFG.doubleTapMs &&
      Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < CFG.doubleTapRadiusPx) {
    // نقرة مزدوجة
    if (tracked) unlock();  // إن كان هناك هدف → إلغاء
    lockAt(e.clientX, e.clientY); // ثم قفل جديد
    lastTap = null;
    return;
  }
  lastTap = { x: e.clientX, y: e.clientY, time: now };
});

// ═══════════════════════════════════════════════
//  التكبير
// ═══════════════════════════════════════════════
function setZoom(z) {
  zoom = Math.max(CFG.zoomMin, Math.min(CFG.zoomMax, z));
  videoWrap.style.transform = `scale(${zoom})`;
  zoomLevel.textContent = zoom.toFixed(1) + '×';
}
zoomInBtn.addEventListener('click', e => { e.stopPropagation(); setZoom(zoom + CFG.zoomStep); });
zoomOutBtn.addEventListener('click', e => { e.stopPropagation(); setZoom(zoom - CFG.zoomStep); });
zoomLevel.addEventListener('click', e => { e.stopPropagation(); setZoom(1.0); });

// ═══════════════════════════════════════════════
//  التسجيل
// ═══════════════════════════════════════════════
function pickMime() {
  const types = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const t of types) if (MediaRecorder.isTypeSupported(t)) return t;
  return '';
}

function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return mm + ':' + ss;
}

function startRecording() {
  if (recording || !running) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  // حجم التسجيل
  let CW = vw, CH = vh;
  const maxDim = CFG.recMaxDim;
  if (Math.max(CW, CH) > maxDim) {
    const k = maxDim / Math.max(CW, CH);
    CW = Math.round(CW * k); CH = Math.round(CH * k);
  }
  recCanvas.width = CW; recCanvas.height = CH;

  // نبني تدفق من الكانفس
  const streamFromCanvas = recCanvas.captureStream(30);
  const mime = pickMime();

  try {
    recorder = new MediaRecorder(streamFromCanvas, mime ? { mimeType: mime, videoBitsPerSecond: 3000000 } : undefined);
  } catch (e) {
    showError('التسجيل غير مدعوم على هذا المتصفح: ' + e.message);
    return;
  }
  recChunks = [];
  recorder.ondataavailable = ev => { if (ev.data && ev.data.size > 0) recChunks.push(ev.data); };
  recorder.onstop = () => {
    const blob = new Blob(recChunks, { type: mime || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ext = (mime && mime.includes('mp4')) ? 'mp4' : 'webm';
    a.href = url;
    a.download = `MokTrak_${Date.now()}.${ext}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    setStatus('✅ تم حفظ التسجيل', 2500);
  };
  recorder.start(1000);
  recording = true;
  recStartTime = performance.now();
  recordBtn.classList.add('on');
  recIndicator.style.display = 'flex';
  recTimer = setInterval(() => {
    recTime.textContent = fmtTime(performance.now() - recStartTime);
  }, 500);
  setStatus('⏺ بدأ التسجيل', 1500);
}

function stopRecording() {
  if (!recording || !recorder) return;
  try { recorder.stop(); } catch (e) {}
  recording = false;
  recordBtn.classList.remove('on');
  recIndicator.style.display = 'none';
  clearInterval(recTimer);
  recorder = null;
}

recordBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (recording) stopRecording();
  else startRecording();
});

// يرسم الكائن على كانفس التسجيل
function drawForRecording() {
  if (!recording || !recCanvas.width) return;
  const CW = recCanvas.width, CH = recCanvas.height;
  const VW = video.videoWidth, VH = video.videoHeight;
  const Z = zoom;

  // المصدر (مع الزوم)
  const srcW = VW / Z, srcH = VH / Z;
  const srcX = (VW - srcW) / 2, srcY = (VH - srcH) / 2;

  recCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, CW, CH);

  // رسم الصندوق والصليب
  if (tracked) {
    // إحداثيات الكائن في الفيديو
    const vScaleX = VW / grayW, vScaleY = VH / grayH;
    const ovx = tracked.cx * vScaleX;
    const ovy = tracked.cy * vScaleY;
    const ovw = CFG.patchSize * tracked.scale * vScaleX;
    const ovh = CFG.patchSize * tracked.scale * vScaleY;

    // موقع الكائن داخل التسجيل (بعد زوم crop)
    const kx = CW / srcW, ky = CH / srcH;
    const bx = (ovx - ovw/2 - srcX) * kx;
    const by = (ovy - ovh/2 - srcY) * ky;
    const bw = ovw * kx;
    const bh = ovh * ky;

    if (tracked.live) {
      recCtx.strokeStyle = '#00ff88';
      recCtx.lineWidth = Math.max(2, Math.min(CW, CH) * 0.005);
      recCtx.shadowColor = '#00ff88';
      recCtx.shadowBlur = 8;
      recCtx.strokeRect(bx, by, bw, bh);
      recCtx.shadowBlur = 0;

      // صليب صغير
      const ccx = bx + bw/2, ccy = by + bh/2;
      const cs = Math.max(10, Math.min(bw, bh) * 0.2);
      recCtx.beginPath();
      recCtx.moveTo(ccx - cs, ccy); recCtx.lineTo(ccx - cs/3, ccy);
      recCtx.moveTo(ccx + cs/3, ccy); recCtx.lineTo(ccx + cs, ccy);
      recCtx.moveTo(ccx, ccy - cs); recCtx.lineTo(ccx, ccy - cs/3);
      recCtx.moveTo(ccx, ccy + cs/3); recCtx.lineTo(ccx, ccy + cs);
      recCtx.stroke();
    }
  }

  // علامة المركز الأصفر
  recCtx.strokeStyle = 'rgba(255,235,59,.9)';
  recCtx.lineWidth = 2;
  const mcx = CW/2, mcy = CH/2;
  recCtx.beginPath();
  recCtx.moveTo(mcx - 12, mcy); recCtx.lineTo(mcx - 4, mcy);
  recCtx.moveTo(mcx + 4, mcy); recCtx.lineTo(mcx + 12, mcy);
  recCtx.moveTo(mcx, mcy - 12); recCtx.lineTo(mcx, mcy - 4);
  recCtx.moveTo(mcx, mcy + 4); recCtx.lineTo(mcx, mcy + 12);
  recCtx.stroke();
}

// ═══════════════════════════════════════════════
//  الرسم على الشاشة
// ═══════════════════════════════════════════════
function drawCross(cx, cy, size, live) {
  ctx.save();
  ctx.strokeStyle = live ? '#00ff88' : '#ffca28';
  ctx.fillStyle = ctx.strokeStyle;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = live ? 9 : 3;
  ctx.lineWidth = 2;
  const g = size * .28, a = size;
  ctx.beginPath();
  ctx.moveTo(cx - a, cy); ctx.lineTo(cx - g, cy);
  ctx.moveTo(cx + g, cy); ctx.lineTo(cx + a, cy);
  ctx.moveTo(cx, cy - a); ctx.lineTo(cx, cy - g);
  ctx.moveTo(cx, cy + g); ctx.lineTo(cx, cy + a);
  ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, g * .9, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 2;
  for (let k = 0; k < 4; k++) {
    const ang = k * Math.PI / 2 + Math.PI / 4;
    ctx.beginPath(); ctx.arc(cx, cy, a + 4, ang - .18, ang + .18); ctx.stroke();
  }
  ctx.restore();
}

function drawCenterMarker(cx, cy) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,235,59,.85)';
  ctx.fillStyle = 'rgba(255,235,59,.85)';
  ctx.shadowColor = '#ffeb3b';
  ctx.shadowBlur = 6;
  ctx.lineWidth = 1.5;
  const s = 12, g = 4;
  ctx.beginPath();
  ctx.moveTo(cx - s, cy); ctx.lineTo(cx - g, cy);
  ctx.moveTo(cx + g, cy); ctx.lineTo(cx + s, cy);
  ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy - g);
  ctx.moveTo(cx, cy + g); ctx.lineTo(cx, cy + s);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawTracked() {
  const f = fit();
  const vScaleX = (video.videoWidth || 640) / grayW;
  const vScaleY = (video.videoHeight || 480) / grayH;

  if (tracked) {
    const regionPx = CFG.patchSize * tracked.scale;
    const vx = tracked.cx * vScaleX;
    const vy = tracked.cy * vScaleY;
    const vw = regionPx * vScaleX;
    const vh = regionPx * vScaleY;

    // في إحداثيات الفيديو → محلية (بدون زوم، لأن الكانفس داخل videoWrap)
    const tl_x = f.ox + (vx - vw / 2) * f.scale;
    const tl_y = f.oy + (vy - vh / 2) * f.scale;
    const bw = vw * f.scale;
    const bh = vh * f.scale;
    const objCx = tl_x + bw / 2, objCy = tl_y + bh / 2;

    // مركز الشاشة (محلي)
    const scx = f.w / 2, scy = f.h / 2;

    // خط من المركز
    ctx.save();
    ctx.strokeStyle = 'rgba(255,235,59,.4)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(scx, scy); ctx.lineTo(objCx, objCy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // مربع أخضر
    ctx.save();
    ctx.strokeStyle = tracked.live ? '#00ff88' : '#ffca28';
    ctx.lineWidth = 1.8;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = tracked.live ? 8 : 3;
    ctx.strokeRect(tl_x, tl_y, bw, bh);
    ctx.shadowBlur = 0;
    // زوايا
    const cl = Math.min(bw, bh) * 0.18;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(tl_x, tl_y + cl); ctx.lineTo(tl_x, tl_y); ctx.lineTo(tl_x + cl, tl_y);
    ctx.moveTo(tl_x + bw - cl, tl_y); ctx.lineTo(tl_x + bw, tl_y); ctx.lineTo(tl_x + bw, tl_y + cl);
    ctx.moveTo(tl_x + bw, tl_y + bh - cl); ctx.lineTo(tl_x + bw, tl_y + bh); ctx.lineTo(tl_x + bw - cl, tl_y + bh);
    ctx.moveTo(tl_x + cl, tl_y + bh); ctx.lineTo(tl_x, tl_y + bh); ctx.lineTo(tl_x, tl_y + bh - cl);
    ctx.stroke();
    ctx.restore();

    // صليب على الكائن
    const crossSize = Math.max(12, Math.min(bw, bh) * 0.18);
    drawCross(objCx, objCy, crossSize, tracked.live);
  }

  // علامة مركز الشاشة دائمًا
  drawCenterMarker(f.w / 2, f.h / 2);
}

function drawPendingTap(now) {
  if (!lastTap) return;
  const age = now - lastTap.time;
  if (age > CFG.doubleTapMs) return;
  const r = canvas.getBoundingClientRect();
  const x = lastTap.x - r.left;
  const y = lastTap.y - r.top;
  const alpha = 1 - age / CFG.doubleTapMs;
  ctx.save();
  ctx.strokeStyle = `rgba(255,235,59,${alpha})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, 12 + (1 - alpha) * 12, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,235,59,${alpha})`;
  ctx.fill();
  ctx.restore();
}

function updatePanel(now) {
  if (!tracked) return;
  const vScaleX = (video.videoWidth || 640) / grayW;
  const vScaleY = (video.videoHeight || 480) / grayH;
  const vcx = tracked.cx * vScaleX, vcy = tracked.cy * vScaleY;
  const relX = vcx - (video.videoWidth / 2);
  const relY = vcy - (video.videoHeight / 2);
  const vw = CFG.patchSize * tracked.scale * vScaleX;
  const vh = CFG.patchSize * tracked.scale * vScaleY;
  const speed = Math.hypot(tracked.velocity[0] * vScaleX, tracked.velocity[1] * vScaleY);
  const zoomFactor = tracked.scale / (tracked.initRegionSize / CFG.patchSize);
  const age = now - tracked.lastSeen;

  let status = 'نشط', cls = 'good';
  if (!tracked.live) { status = 'استعادة'; cls = 'warn'; }
  if (age > 500) { status = 'مفقود'; cls = 'bad'; }

  panel.innerHTML =
    '<div class="title">🎯 الهدف</div>' +
    '<div class="row"><span class="k">الحالة</span><span class="' + cls + '">' + status + '</span></div>' +
    '<div class="row"><span class="k">X</span><span class="v">' + relX.toFixed(0) + '</span></div>' +
    '<div class="row"><span class="k">Y</span><span class="v">' + relY.toFixed(0) + '</span></div>' +
    '<div class="row"><span class="k">حجم</span><span class="v">' + vw.toFixed(0) + '×' + vh.toFixed(0) + '</span></div>' +
    '<div class="row"><span class="k">زوم كائن</span><span class="v">' + zoomFactor.toFixed(2) + '×</span></div>' +
    '<div class="row"><span class="k">سرعة</span><span class="v">' + speed.toFixed(0) + '</span></div>' +
    '<div class="row"><span class="k">SAD</span><span class="v">' + tracked.sad.toFixed(0) + '</span></div>';

  espSender.send();
}

function render(now) {
  const r = wrap.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  drawTracked();
  drawPendingTap(now);
  if (tracked) updatePanel(now);
}

// ═══════════════════════════════════════════════
//  الحلقة
// ═══════════════════════════════════════════════
function loop() {
  if (!running) return;
  const now = performance.now();
  fpsN++;
  if (now - fpsT >= 1000) {
    fps = fpsN * 1000 / (now - fpsT);
    fpsEl.textContent = fps.toFixed(0) + ' fps';
    fpsN = 0; fpsT = now;
  }
  if (video.readyState >= 2 && now - lastFrame > CFG.frameIntervalMs) {
    lastFrame = now;
    frameCount++;
    if (tracked) trackStep(now);
    render(now);
    if (recording) drawForRecording();
  }
  rafId = requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════
//  التشغيل
// ═══════════════════════════════════════════════
async function start() {
  startBtn.disabled = true;
  startBtn.textContent = 'جارٍ التشغيل…';
  hideError();
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('الكاميرا تحتاج HTTPS.');
    }
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1280 }, height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 }
      }
    });
    video.srcObject = stream;
    await new Promise((res, rej) => {
      if (video.readyState >= 1) { res(); return; }
      video.onloadedmetadata = res;
      setTimeout(() => rej(new Error('انتهت مهلة الكاميرا')), 10000);
    });
    await video.play();
    initGrayCanvas();
    resize();
    running = true;
    startBtn.style.display = 'none';
    bottomBar.style.display = 'flex';
    zoomBar.style.display = 'flex';
    $('espBar').style.display = 'flex';
    hud.textContent = 'MokTrak · جاهز';
    hint.style.display = 'block';
    setTimeout(() => { if (!tracked) hint.style.display = 'none'; }, 6000);
    loop();
  } catch (e) {
    showError('تعذر التشغيل: ' + (e.message || e) + '\n\nتأكد من:\n• السماح بالكاميرا\n• فتح الرابط عبر HTTPS');
    hud.textContent = 'تعذر التشغيل';
    startBtn.disabled = false;
    startBtn.textContent = '↻ إعادة المحاولة';
  }
}

async function switchCamera() {
  if (!running) return;
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) stream.getTracks().forEach(t => t.stop());
  running = false;
  cancelAnimationFrame(rafId);
  unlock();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1280 }, height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 }
      }
    });
    video.srcObject = stream;
    await video.play();
    initGrayCanvas();
    running = true;
    frameCount = 0;
    loop();
  } catch (e) {
    showError('تعذر تبديل الكاميرا: ' + e.message);
    running = false;
  }
}

startBtn.addEventListener('click', start);
switchBtn.addEventListener('click', e => { e.stopPropagation(); switchCamera(); });
resetBtn.addEventListener('click', e => { e.stopPropagation(); unlock(); });

window.addEventListener('pagehide', () => {
  running = false;
  cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (recording) stopRecording();
  espSender.stop();
});

// Service Worker (اختياري)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
})();
</script>
